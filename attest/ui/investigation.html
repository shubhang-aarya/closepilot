<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async p => { const r = await fetch(p);
  if (!r.ok) throw new Error(`${p} → ${r.status}`); return r.json(); };
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const REVIEW = 25000;   // the policy's own default — see attest/policy.py Costs
/* The two cases the front door demonstrates. Both are settlements in the
   HELD-OUT evaluation seed, chosen because between them they show the loop
   closing and the loop refusing — and verified against ground truth by
   tests/test_invariants.py::test_the_two_demo_cases_are_what_the_demo_says
   _they_are, because an id is not a percentage and the claim register cannot
   catch it drifting. */
const PROVEN_CASE = 'setl_000233';   // PROVEN -> AUTO_POST -> ledger entry
const CASE = 'setl_000225';          // AMBIGUOUS -> held, evidence requested
const cap = s => esc(String(s ?? '').trim().replace(/[.\s]+$/, ''))
  .replace(/^./, c => c.toUpperCase());

const SECTIONS = [
  ['open','control'], ['proof','evidence'], ['product','investigate'],
  ['outcomes','policy'], ['population','journal'], ['ai','activity'],
  ['proofs','trust'],
];
/* The seven instruments name the nav, because they are what the product is.
   The sections below map onto them; a reader who clicks EVIDENCE lands on the
   part of the story that instrument answers. */
/* The product is one loop, and the seven instruments are seven points on it.
   The engine may stop early — that is the product, not a failure — so ABSTAIN
   is a station rather than an error branch. */
const LOOP = [
  ['ingest','ingest'], ['reconcile','reconcile'], ['prove','prove'],
  ['decide','decide'], ['act','act'], ['audit','audit'],
];
/* which stage of the loop each section is standing in */
const STAGE = {
  open:'ingest', proof:'reconcile', product:'prove', outcomes:'act',
  population:'decide', ai:'prove', proofs:'audit', end:'audit',
};
/* Seven instruments, seven anchors — the index names what the product HAS,
   and each entry lands on the part of the story that instrument answers. */
const NAV = [
  ['open','01','CONTROL'], ['proof','02','EVIDENCE'], ['product','03','INVESTIGATE'],
  ['outcomes','04','POLICY'], ['population','05','JOURNAL'], ['ai','06','ACTIVITY'],
  ['proofs','07','TRUST'],
];

/* ── the population field ────────────────────────────────────────────────
   One point per settlement, coloured by the verdict the engine reached, in
   lanes sized by their own counts. The lone contradicted point sits alone,
   which is the honest picture of a run with one of them in it. */
function Field(host, spec) {
  const cv = document.createElement('canvas'); host.appendChild(cv);
  const cx = cv.getContext('2d');
  let W=0,H=0,pts=[],lanes=[],shown=false,raf=0,t0=0,seed=20260821;
  const rnd=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
  const TONE={ink:'#ffffff',dim:'rgba(255,255,255,.26)',coral:'#ff655a',
              proven:'#5fbf9b',lit:'#dcf23c'};
  function build(){
    seed=20260821; pts=[];
    const dpr=Math.min(devicePixelRatio||1,2);
    W=host.clientWidth; H=host.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const gs=spec.groups, total=gs.reduce((a,g)=>a+g.n,0)||1;
    const gap=Math.min(spec.lane||40, W*.07), gaps=gs.length-1;
    const per=(W-gaps*gap)/total;
    let x0=0;
    lanes=[];
    gs.forEach(g=>{
      /* Squarish blocks by default. The opening instrument passes a wider
         aspect so the population spans the measure instead of huddling in the
         middle of it — same primitive, different job. */
      const cols=Math.max(1,Math.round(Math.sqrt(g.n*(spec.aspect||1.7))));
      const rows=Math.ceil(g.n/cols);
      const cell=Math.min((g.n*per)/cols, H/rows, spec.cell||13);
      const top=(H-rows*cell)/2;
      for(let i=0;i<g.n;i++)
        pts.push({x:x0+(i%cols)*cell+cell/2+(rnd()-.5)*1.3,
                  y:top+((i/cols)|0)*cell+cell/2+(rnd()-.5)*1.3,
                  r:g.r||1.9, c:g.tone, d:rnd()});
      // the lane's own rect, so a label can be pinned to the points it names
      lanes.push({g, x:x0, w:cols*cell, y:top, h:rows*cell});
      x0+=cols*cell+gap;
    });
    const shift=Math.max(0,(W-(x0-gap))/2);
    pts.forEach(p=>{p.x+=shift;});
    lanes.forEach(l=>{l.x+=shift;});
    paintLabels();
  }

  /* §32.A — the field carries its own legend.
   *
   * The population rendered as two coloured blocks and a lone dot with the
   * counts three sections away, on the specimen. A reader saw an ornament.
   * Every label here is pinned to the lane it names and reads its count from
   * the same group that drew the points, so the two cannot disagree — change
   * the disposition and the label changes with it.
   *
   * They are DOM, not canvas: a legend that cannot be selected, read by a
   * screen reader, or found by the comprehension audit is not a legend. */
  function paintLabels(){
    if(!spec.groups.some(g=>g.label)) return;
    host.querySelectorAll('.fld-l').forEach(n=>n.remove());
    // one baseline for every label. Lanes are vertically centred and differ in
    // height, so hugging each lane's own bottom edge staggered them and the
    // legend read as three unrelated notes rather than one reading of one
    // population.
    const floor=Math.max(...lanes.map(l=>l.y+l.h))+11;
    let floorX = 0;
    for(const l of lanes){
      if(!l.g.label) continue;
      const el=document.createElement('span');
      el.className='fld-l';
      const wide = W > 620;
      el.style.top=`${floor}px`;
      el.style.minWidth=`${Math.max(l.w, 54)}px`;
      el.style.maxWidth=`${Math.max(l.w + (wide ? 120 : 40), 90)}px`;
      // never start a label where it cannot finish, and never start one on top
      // of the label before it: a lane is as wide as its share of the
      // population, and two small lanes running consecutively put their labels
      // in the same place.
      const want = Math.max(0, Math.min(l.x, W - 90));
      el.style.left=`${Math.max(want, floorX)}px`;
      if(!wide) el.style.whiteSpace='normal';
      el.style.color=TONE[l.g.tone]||TONE.dim;
      el.innerHTML=`<b>${l.g.n.toLocaleString()}</b>${esc(l.g.label)}`;
      host.appendChild(el);
      if(el.offsetLeft + el.offsetWidth > W)
        el.style.left=`${Math.max(0, W - el.offsetWidth)}px`;
      floorX = el.offsetLeft + el.offsetWidth + 14;
    }
  }
  function draw(t){
    cx.clearRect(0,0,W,H);
    for(const p of pts){
      const a=STILL?1:Math.max(0,Math.min(1,(t-p.d*.5)/.45));
      if(a<=0) continue;
      cx.globalAlpha=a; cx.fillStyle=TONE[p.c]||TONE.dim;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.2832); cx.fill();
    }
    cx.globalAlpha=1;
  }
  function run(ts){ if(!t0) t0=ts; const t=Math.min(1.1,(ts-t0)/850);
    draw(t); if(t<1.1) raf=requestAnimationFrame(run); }
  return {
    show(){ if(shown) return; shown=true; build();
      if(STILL){draw(1.1);return;} t0=0; raf=requestAnimationFrame(run); },
    resize(){ if(!shown) return; build(); draw(1.1); },
  };
}
</script>
<script>
'use strict';
const rise=(c,h,d)=>`<div class="rise${d?' d'+d:''}${c?' '+c:''}">${h}</div>`;
const mk=(n,l,note,step)=>`<div class=mk><b>${String(n).padStart(2,'0')}</b>${esc(l)}${
  note?`<em>${esc(note)}</em>`:''}${step!==undefined?chain(step):''}</div>`;

/* §32.C — THE NARROWING, carried between the sections that do it.
 *
 * 250 becomes 197 becomes one case becomes 2,368 candidate orders becomes 164
 * becomes 4. That is one continuous act of narrowing the evidence space, and
 * it was four separate sections with nothing carrying the thread between them.
 * A reader met four good moments and no movie.
 *
 * The chain rides in the marker column of each of those sections with the
 * current step lit, so a reader always knows how far in they are and what the
 * number in front of them narrowed FROM. Every value is the run's; nothing
 * here is written down. */
let CHAIN = [];
const chain = (step) => `<div class=nrw>${CHAIN.map((c,i)=>`
  <div class="nrw-r${i===step?' on':''}${i<step?' past':''}">
    <b>${c.n.toLocaleString()}</b><span>${esc(c.l)}</span>
  </div>`).join('')}</div>`;

/* ── §58 the decision record, rendered ────────────────────────────────────
   Takes /api/loop verbatim. One financial event, four parties, one outcome.
   Every string is either a label this file owns or a value the engine
   produced — which is why the same function renders the record that posts and
   the record that does not. */
function Record(d, opts){
  const o = opts||{};
  const rupee = p => `₹${(p/100).toLocaleString('en-IN',
    {minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const acted = !!d.acted;
  const ev = d.event||{}, out = d.outcome||{};

  const may = s => `<span class=dr-may>
    <span class=y><i>may</i><span>${esc(s.may||'')}</span></span>
    <span class=n><i>may not</i><span>${esc(s.may_not||'')}</span></span></span>`;

  const body = {
    advisor(s){
      const a = s.advisor||{}; const tr = a.track_record||{};
      if(!a.proposed) return `<p>${esc(a.detail||'')}</p>` + may(s);
      return `<p>${esc(a.reasoning||'')}</p>
        <span class=dr-ids>${(a.orders||[]).map(esc).join(' · ')}</span>
        <p>It was never shown an amount — identifiers, names and dates only. A
          proposer that can see the target finds something that adds up, and a
          plausible sum is the thing this system exists to refuse.</p>
        ${tr.resolved ? `<p>Across the held-out panel it offered an answer on
          <b style="color:var(--ink)">${tr.resolved}</b> of ${tr.ambiguous}
          ambiguous cases and was right on
          <b style="color:var(--ink)">${tr.correct}</b> of them.</p>` : ''}
        ${may(s)}`;
    },
    verifier(s){
      const cuts = (s.reductions||[]).filter(r=>r.removed>0);
      const n = s.narrowing||{};
      return `<p>${esc(s.detail||'')}</p>
        ${s.narrowing_line ? `<span class=dr-nar>${
          esc(String(n.universe||0).replace(/\B(?=(\d{3})+(?!\d))/g, ','))}
          <u>records</u> → ${n.candidates} <u>candidates</u> → ${
          n.explanations} <u>explanation${n.explanations===1?'':'s'}</u></span>`:''}
        ${cuts.length ? `<span class=dr-cut>${cuts.map(r=>`
          <span class=rm>−${Number(r.removed).toLocaleString()}</span>
          <span>${esc(r.name)}</span>
          <span class="k ${r.deterministic?'d':'c'}">${
            r.deterministic?'fact':'convention'}</span>`).join('')}</span>`:''}
        ${s.residual_paise!=null ? `<p>Residual
          <b style="color:var(--ink)">${s.residual_paise}
          ${s.residual_paise===1?'paisa':'paise'}</b> against a rounding bound
          of ±${s.tolerance_paise}.</p>`:''}
        ${(s.agreed_orders&&s.contested_orders) ? `<p><b style="color:var(--ink)">${
          rupee(s.agreed_paise)}</b> across ${s.agreed_orders} orders is settled
          whichever explanation is right. <b style="color:var(--coral)">${
          rupee(s.contested_paise)}</b> across ${s.contested_orders} orders is
          the argument.</p>`:''}
        <p>${esc(s.mechanisms||'')} — <b style="color:var(--ink)">without
          reading what the advisor proposed</b>.</p>
        ${s.advisor_outcome ? `<p>Tested the advisor's proposal:
          <b style="color:var(--ink)">${esc(s.advisor_outcome)}</b>.</p>`:''}
        ${may(s)}`;
    },
    policy(s){
      return `<p>${esc(s.detail||'')}</p>
        ${s.p_error!=null ? `<p>Priced at the measured error rate for this class
          of result, at its 95% upper bound — <b style="color:var(--ink)">${
          Number(s.p_error).toFixed(4)}</b> — not at the point estimate.</p>`:''}
        ${may(s)}`;
    },
    ledger(s){
      if(!(s.lines||[]).length) return `<p>${esc(s.detail||'')}</p>` + may(s);
      return `<span class=dr-je>${s.lines.map(l=>`
        <span>${esc(l.account)}</span>
        <span class=amt>${l.debit_paise?'Dr ':'Cr '}${
          rupee(l.debit_paise||l.credit_paise)}</span>`).join('')}</span>
        <p>Balanced to the paisa, every line derived from the rule set that
          produced the proof.</p>${may(s)}`;
    },
  };

  const cls = s => s.key==='advisor' ? 'adv'
    : (s.key==='ledger'||s.key==='policy') ? (acted?'acts':'holds') : '';

  return `<figure class=dr>
    <div class=dr-e>
      <div><span class=dr-ek>${esc(o.label||'financial event')}</span>
        <div class=dr-ev>${rupee(ev.amount_paise||d.amount_paise)}</div>
        <p class=dr-eq><b>${esc(ev.question||'')}</b> ${esc(ev.unknown||'')}</p></div>
      <div class=dr-em>${esc(d.settlement_id)}<br>UTR ${esc(d.utr||'—')}<br>${
        esc(ev.value_date||'')}</div>
    </div>
    ${(d.stages||[]).map(s=>`
      <div class="dr-r ${cls(s)}">
        <span class=dr-a><b>${esc(s.actor)}</b><em>${esc(s.verb)}</em></span>
        <span class=dr-n><i class=dr-dot></i></span>
        <span class=dr-b>
          <b class=dr-h>${esc(s.headline)}${s.badge
            ? `<span class=dr-badge>${esc(s.badge)}</span>`:''}</b>
          ${(body[s.key]||(()=>`<p>${esc(s.detail||'')}</p>`))(s)}
        </span>
      </div>`).join('')}
    <div class="dr-out ${acted?'go':'stop'}">
      <div><div class=dr-oh>${esc(out.headline||'')}</div>
        <p class=dr-oc>${esc(out.consequence||'')}</p></div>
      <span class=dr-ov>${acted?'action':'no financial action'}</span>
    </div>
  </figure>`;
}


/* ── the control loop, rendered ───────────────────────────────────────────
   §57. Takes /api/loop verbatim. Every string below is either a label this
   file owns or a value the engine produced; nothing about a case is written
   down here, which is why the same function renders the settlement that
   posts and the one that does not. */
function Loop(d, opts){
  const o = opts||{};
  const rupee = p => `₹${(p/100).toLocaleString('en-IN',
    {minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const stage = k => (d.stages||[]).find(s=>s.key===k)||{};
  const acted = !!d.acted;

  const body = {
    advisor(s){
      const a = s.advisor||{};
      if(!a.proposed) return `<p>${esc(a.detail||'')}</p>`;
      const tr = a.track_record||{};
      return `<p>${esc(a.reasoning||'')}</p>
        <div class=cloop-ids>named <b>${(a.orders||[]).map(esc).join('</b> · <b>')}</b></div>
        <p style="margin-top:8px">It did not see an amount. The advisor is given
          identifiers, names and dates and never a value — a proposer that can
          see the target finds something that adds up, and a plausible sum is
          the thing this engine exists to refuse.</p>
        ${tr.resolved ? `<p>On the held-out panel this advisor offered an answer
          on <b style="color:var(--ink)">${tr.resolved}</b> of ${tr.ambiguous}
          ambiguous cases and was right on
          <b style="color:var(--ink)">${tr.correct}</b> of them.</p>` : ''}`;
    },
    solver(s){
      const cuts = (s.reductions||[]).filter(r=>r.removed>0);
      return `<p>${esc(s.detail||'')}</p>
        ${cuts.length ? `<div class=cloop-cut>${cuts.map(r=>`
          <span class=rm>−${Number(r.removed).toLocaleString()}</span>
          <span>${esc(r.name)}</span>
          <span class="kind ${r.deterministic?'det':'conv'}">${
            r.deterministic?'fact':'convention'}</span>`).join('')}</div>` : ''}
        ${s.outcome ? `<p style="margin-top:9px">Tested the advisor's proposal:
          <b style="color:var(--ink)">${esc(s.outcome)}</b>.</p>` : ''}`;
    },
    engine(s){
      const bits = [`<p>${esc(s.detail||'')}</p>`];
      if(s.headline === 'PROVEN' && s.residual_paise !== null
         && s.residual_paise !== undefined)
        bits.push(`<p>Residual <b style="color:var(--ink)">${s.residual_paise}
          ${s.residual_paise === 1 ? 'paisa' : 'paise'}</b> against a rounding
          bound of ±${s.tolerance_paise}.</p>`);
      if(s.agreed_orders && s.contested_orders)
        bits.push(`<p><b style="color:var(--ink)">${rupee(s.agreed_paise)}</b>
          across ${s.agreed_orders} orders is settled whichever explanation is
          right. <b style="color:var(--coral)">${rupee(s.contested_paise)}</b>
          across ${s.contested_orders} orders is the argument.</p>`);
      bits.push(`<p>${esc(s.kernel||'')} — <b style="color:var(--ink)">without
        reading what the advisor proposed</b>.</p>`);
      return bits.join('');
    },
    policy(s){
      return `<p>${esc(s.detail||'')}</p>
        ${s.p_error!=null ? `<p>Priced at the measured error rate for this class
          of result, at its 95% upper bound — <b style="color:var(--ink)">${
          Number(s.p_error).toFixed(4)}</b> — not at the point estimate.</p>`:''}`;
    },
    ledger(s){
      if(!(s.lines||[]).length) return `<p>${esc(s.detail||'')}</p>`;
      return `<div class=cloop-je>${s.lines.map(l=>`
        <span>${esc(l.account)}<em style="color:var(--dim3);font-style:normal">
          — ${esc(l.memo)}</em></span>
        <span class=amt>${l.debit_paise?'Dr ':'Cr '}${
          rupee(l.debit_paise||l.credit_paise)}</span>`).join('')}</div>
        <p style="margin-top:9px">Balanced to the paisa, and every line derived
          from the rule set that produced the proof.</p>`;
    },
  };

  const cls = s => s.key==='advisor' ? 'ai'
    : (s.key==='ledger' && acted) || (s.key==='policy' && acted) ? 'acts'
    : (s.key==='ledger' || s.key==='policy') ? 'holds' : '';

  return `<figure class=cloop>
    <div class=cloop-h>
      <i>${esc(o.label||'the loop')}</i>
      <b>${esc(d.settlement_id)} · ${rupee(d.amount_paise)}</b>
      <u class="${acted?'ok':'no'}">${acted
        ? 'posted without a person'
        : 'held — no financial action'}</u>
    </div>
    ${(d.stages||[]).map(s=>`
      <div class="cloop-r ${cls(s)}">
        <span class=cloop-actor><b>${esc(s.actor)}</b><em>${esc(s.verb)}</em></span>
        <span class=cloop-node><i class=cloop-dot></i></span>
        <span class=cloop-body>
          <b class=cloop-hd>${esc(s.headline)}</b>
          ${(body[s.key]||(()=>`<p>${esc(s.detail||'')}</p>`))(s)}
          <span class=cloop-auth>${esc(s.authority)}</span>
        </span>
      </div>`).join('')}
  </figure>`;
}


async function build(){
  const main=document.getElementById('main');
  try{
    const run=await api('/api/run?n=250'); const id=run.run_id;
    /* whether this seed was held out from calibration, read from the panel
       artifact rather than asserted here. A number measured on the data it
       was tuned on is a memory, not a measurement, and nothing on screen
       said which this was. */
    const basis=(run.seed_basis||{}).short||'';
    const [rec,spine,acts,det,inv,dec,claims,act,loopOk,loopHeld]=await Promise.all([
      api(`/api/subject?run=${id}&type=portfolio&id=portfolio`),
      api(`/api/spine?run=${id}&type=portfolio&review=${REVIEW}&exposure=10000000`),
      api(`/api/actions?run=${id}`),
      api(`/api/settlement?run=${id}&id=${CASE}`),
      api(`/api/investigation?run=${id}&type=settlement&id=${CASE}`),
      api(`/api/decision?run=${id}&type=settlement&id=${CASE}&review=${REVIEW}&exposure=10000000`),
      api(`/api/claims?run=${id}`),
      api(`/api/activity?run=${id}&type=settlement&id=${CASE}`),
      api(`/api/loop?run=${id}&id=${PROVEN_CASE}&review=${REVIEW}`),
      api(`/api/loop?run=${id}&id=${CASE}&review=${REVIEW}`),
    ]);
    const src=rec.source||{}, st=k=>spine.stages.find(s=>s.key===k)||{};
    const c=run.counts||{}, space=det.space||{}, b=dec.boundary||{};
    const survivors=(det.proofs||[]).length;
    const blocker=(acts.actions||[])[0]||{};
    const held=spine.stages.reduce((n,s)=>n+(s.held||0),0);
    const iso=claims.isolation||{}, adv=claims.adversarial||{};
    const base=claims.baselines||{present:false}, anch=claims.anchoring||{};
    const krn=claims.kernel||{present:false};
    const top=Math.max(...spine.stages.map(s=>s.continues_paise),1);
    const exportable=(c.AMBIGUOUS||0)+(c.CONTRADICTED||0)+(c.INSUFFICIENT||0);
    const rupee=p=>`₹${(p/100).toLocaleString('en-IN',
      {minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const stop=spine.stages.find(s=>s.state==='stopped')||{};

    /* the narrowing, in the order the engine performs it */
    CHAIN = [
    {n: run.settlements,     l: 'settlements'},
    {n: c.AMBIGUOUS,         l: 'ambiguous'},
    {n: 1,                   l: 'of them'},
    {n: space.universe,      l: 'orders'},
    {n: space.candidates,    l: 'candidates'},
    {n: survivors,           l: 'explanations'},
  ];

    document.getElementById('prov').innerHTML =
      `${esc(src.label||'')} · ${esc((src.engine||{}).label||'')} · seed ${
        esc(String(run.seed))} · ${esc(basis)} · <b>${esc(id)}</b>`;

    /* the worst false-proof rate sets the scale, so the bars compare */
    const worst=base.present
      ? Math.max(...base.methods.map(m=>m.false_proof||0),0.01) : 1;

    main.innerHTML=`

<section id=open>
${rise('', `<div class=mast>
    <span class=mast-n>ATTEST</span>
    <span class=mast-t>financial control</span>
    <span class=mast-r>${esc(src.label||'')} · ${esc((src.engine||{}).label||'')}
      · seed ${esc(String(run.seed))} · ${esc(basis)} · ${esc(id)}</span>
  </div>`)}
  ${rise('', `<h1 class=hero-t>AI can decide.<br>Your ledger can't guess.</h1>
    <p class=claim-p>ATTEST is a financial control layer that verifies
      AI-proposed actions <b>before they can change financial state</b>.</p>`, 1)}

  ${rise('', `<div class=auth>
    <div class="auth-c adv"><span class=auth-w>Advise</span>
      <span class=auth-n>Where to look</span>
      <span class=auth-d>An advisor points at the records it believes belong
        together. It is never shown an amount.</span></div>
    <div class=auth-c><span class=auth-w>Verify</span>
      <span class=auth-n>What the money is</span>
      <span class=auth-d>The explanation is rebuilt from the records
        themselves, without reading the proposal.</span></div>
    <div class=auth-c><span class=auth-w>Permit</span>
      <span class=auth-n>Whether to act alone</span>
      <span class=auth-d>Proof is not permission. Being wrong is priced against
        what a human check costs.</span></div>
    <div class=auth-c><span class=auth-w>Record</span>
      <span class=auth-n>The entry, or the reason</span>
      <span class=auth-d>A balanced entry, or a refusal naming the evidence
        that would settle it.</span></div>
  </div>`, 2)}

  ${anch.ambiguous ? rise('', `<div class=advm>
    <span class=advm-k>the advisor, measured</span>
    <span class=advm-v><b>${anch.resolved}</b> of <b>${
      Number(anch.ambiguous).toLocaleString()}</b> ambiguous cases it had
      anything to say about · right on <b>${anch.correct}</b> of those</span>
    <span class=advm-x>silent on ${(anch.silent_share*100).toFixed(0)}% of the
      work it exists for, so it does not decide — held-out panel,
      <span class=mono>${esc(anch.source||'')}</span></span>
  </div>`, 2) : ''}

  ${rise('', `<a class="act-line door hero-cta" id=open-app href="/app"
    >open control room <i>↗</i></a>`, 2)}
</section>

<section id=proof>
  ${rise('row', mk(1,'the problem',esc(CASE),3)
    + `<h2 class=chapter>One credit. Four ways it could have been paid.</h2>`
    + `<div><p class=say>A gateway pays in one lump sum and does not say which
        orders it covered. For this credit, <b>four different sets of orders
        add up to it exactly</b> — and they discharge different customers.</p>
       <p class=say style="margin-top:12px">A system that scores and picks will
        pick. ATTEST does not: with nothing in the records to separate four
        financially valid answers, choosing one is a guess — and a guess marks
        the wrong customer as paid while the books still balance.</p></div>`)}

  ${rise('', `<div class=case-h>
    <b class=case-m>${esc(rupee(loopHeld.amount_paise))}</b>
    <span class=case-s>${esc(CASE)} · settled ${esc(loopHeld.settled_on)} ·
      UTR ${esc(loopHeld.utr||'—')}</span>
    <span class=case-v>ambiguous · no financial action</span>
  </div>`, 1)}

  ${rise('stage','',1)}
${rise('', `
    <div class=coll>
      <span class=coll-n><b>${Number(space.universe).toLocaleString()}</b>
        <span class=lbl>orders in the book</span></span>
      <i class=coll-a>&rarr;</i>
      <span class=coll-n><b>${Number(space.candidates).toLocaleString()}</b>
        <span class=lbl>could belong to this credit</span></span>
      <i class=coll-a>&rarr;</i>
      <span class="coll-n end"><b>${survivors}</b>
        <span class=lbl>explanations survive</span></span>
    </div>
    <details class=deep><summary>Every cut, and whether it was a fact or a
      convention</summary>
      ${(space.reductions||[]).map(x=>`<div class="red-c ${
        x.deterministic?'det':'conv'}">
        <b>&minus;${Number(x.removed).toLocaleString()}</b>
        <span class=lbl style="color:var(--dim)">${esc(x.name)}
          <i>${x.deterministic?'deterministic':'convention'}</i></span>
        <p>${esc(x.justification)}</p></div>`).join('')}
      <p class=say style="max-width:60ch;margin-top:16px">The last cut is
        arithmetic rather than a rule: what survives is every subset whose net
        equals the credit within tolerance. Some of the others are
        <b>conventions rather than facts</b> &mdash; and uniqueness inside a
        space that already excluded the truth is not uniqueness.</p>
    </details>`, 2)}

  ${rise('hand', `
    <span class=lbl>and until someone does</span>
    <div class=hand-f>
      <span class=u><b>${exportable}</b><span class=lbl>unresolved</span></span>
      <span class=u><b>${esc(stop.held_value||'')}</b><span class=lbl>exposure</span></span>
      <span class=u><b>evidence required</b><span class=lbl>to resolve any of them</span></span>
    </div>
    <p class=hand-p>Each row carries the contested orders, the blocker, the
      specific evidence that would settle it, and the rule, policy and solver
      versions the verdict was produced under. <b>${c.AMBIGUOUS} of the
      ${exportable} share one cause</b> — the ${esc(rupee(
        blocker.leverage_paise||blocker.value_paise||0))} above — so one answer
      settles most of the file.</p>
    <a class="act-line hand-a" id=export
       href="/api/export/queue?run=${encodeURIComponent(run.run_id)}&format=csv"
       download>export investigation queue <i>↓</i></a>
    <span class=hand-n>read-only · no financial action · nothing is posted,
      mutated or transmitted</span>`, 3)}
</section>

<section id=product>
  ${rise('row', mk(2,'the product','four authorities')
    + `<h2 class=chapter>Four parties. Only one of them can move money.</h2>`
    + `<div><p class=say>Every decision passes through all four, in this order.
        The first may be wrong without consequence, because nothing downstream
        reads it.</p></div>`)}

  ${rise('', `<figure class=roles>
    <div class="role adv"><i class=role-d></i>
      <b>Advisor<em>proposes</em></b>
      <p>Proposes investigative signals — which records to look at. Given
        identifiers, names and dates, never an amount.</p>
      <span class=role-x>cannot move money</span></div>
    <div class=role><i class=role-d></i>
      <b>Verifier<em>proves</em></b>
      <p>Independently reconstructs the explanation from the source records and
        proves it, without reading what the advisor said.</p>
      <details class=role-more><summary>how it proves</summary>
        <p>A solver enumerates every subset of the candidate pool whose net
          equals the credit. A separate checker that shares no code with it
          re-derives each survivor from the source records. One survivor proves
          it, several hold it, none contradicts it.</p></details>
      <span class=role-x>cannot be influenced by the proposal</span></div>
    <div class=role><i class=role-d></i>
      <b>Policy<em>permits</em></b>
      <p>Decides whether a proven result is economically safe to automate: the
        measured chance of being wrong, priced against what a review costs.</p>
      <span class=role-x>cannot permit what was not proved</span></div>
    <div class="role act"><i class=role-d></i>
      <b>Ledger<em>records</em></b>
      <p>Records only permitted execution — a balanced entry, or a stated
        refusal. Never a guess and never silence.</p>
      <span class=role-x>cannot bypass verification</span></div>
  </figure>`, 1)}
</section>

<section id=outcomes>
  ${rise('row', mk(3,'the two outcomes','same machinery')
    + `<h2 class=chapter>Same engine. Same advisor. Opposite results.</h2>`
    + `<div><p class=say>What separates them is not confidence. It is whether
        the evidence closed.</p></div>`)}

  ${rise('', `<div class=twin>
    ${[loopOk, loopHeld].map(d=>{
      const st=k=>(d.stages||[]).find(x=>x.key===k)||{};
      const v=st('verifier'), pol=st('policy');
      const n=v.narrowing||{};
      return `<figure class="tw ${d.acted?'go':'stop'}">
        <div class=tw-h><b>${esc(d.verdict)}</b>
          <span>${esc(d.settlement_id)}</span></div>
        <div class=tw-m>${esc(rupee(d.amount_paise))}</div>
        <div class=tw-n>${Number(n.universe||0).toLocaleString()}
          <u>→</u> ${n.candidates} <u>→</u> ${n.explanations}</div>
        <dl class=tw-l>
          ${v.residual_paise!=null
            ? `<div><dt>residual</dt><dd>${esc(rupee(v.residual_paise))}</dd></div>`
            : `<div><dt>in dispute</dt><dd>${esc(rupee(v.contested_paise||0))}</dd></div>`}
          <div><dt>policy</dt><dd>${d.acted
            ? `${esc(rupee(pol.expected_loss_paise||0))} &lt; ${esc(rupee(pol.review_paise||0))}`
            : 'not eligible at any price'}</dd></div>
          <div><dt>next</dt><dd>${d.acted
            ? 'nobody opened it'
            : 'missing evidence'}</dd></div>
        </dl>
        <div class=tw-o>${d.acted
          ? `<b>auto-post</b><span>${esc(rupee(d.amount_paise))} recorded</span>`
          : `<b>hold</b><span>no financial action</span>`}</div>
      </figure>`;}).join('')}
  </div>`, 1)}
</section>

<section id=population>
  ${rise('row', mk(4,'measured','held out, not tuned on')
    + `<h2 class=chapter>Measured, not marketed.</h2>`
    + `<div><p class=say>Read from the evaluation artifacts at load, on seeds
        the policy was never calibrated on.</p></div>`)}

  ${rise('', (()=>{
    const cl = id => (claims.claims||[]).find(x=>x.id===id) || {};
    const me = (base.methods||[]).find(m=>m.key==='attest') || {};
    const pct = v => `${(v*100).toFixed(2).replace(/\.?0+$/,'')}%`;
    const prec = me.decided ? pct((me.decided-me.wrong)/me.decided) : '—';
    const cov  = ((cl('C-003').value||'').match(/attest\s+([\d.]+%)/)||[])[1] || '—';
    return `<div class=strip-e>
      <span class=u><b>${esc(String(base.present?base.panel.settlements:'—'))}</b>
        <span class=lbl>held-out settlements</span></span>
      <span class=u><b>${esc(cov)}</b>
        <span class=lbl>exact recovery</span></span>
      <span class=u><b>${esc(prec)}</b>
        <span class=lbl>proof precision</span></span>
      <span class=u><b class=w-p>${esc(cl('C-001').value||'—')}</b>
        <span class=lbl>wrongly posted</span></span>
      <span class=u><b class=w-p>${me.decided!=null
        ? `${me.decided-me.wrong}/${me.decided}` : '—'}</b>
        <span class=lbl>proofs correct</span></span>
    </div>`;})(), 1)}
  ${rise('', `
  <p class=say style="max-width:64ch;margin-top:20px">This run:
    <b>${esc(rupee(run.processed_paise))}</b> processed —
    <b>${c.PROVEN}</b> proven · <b>${c.AMBIGUOUS}</b> ambiguous ·
    <b>${c.CONTRADICTED}</b> contradicted · <b>${c.INSUFFICIENT}</b> insufficient,
    over ${run.settlements} settlements and
    ${Number(run.orders).toLocaleString()} orders in
    ${Number(run.seconds).toFixed(1)}s.</p>`, 1)}

  ${base.present ? rise('', `    <div class=bench-pop>
      <span><i>live run</i><b>${esc(String(run.settlements))} settlements</b>
        <em>seed ${esc(String(run.seed))} · ${esc(basis)}</em></span>
      <span><i>benchmark panel</i><b>${esc(String(base.panel.settlements))} settlements</b>
        <em>${esc(String(base.panel.seeds))} seeds × ${esc(String(base.panel.per_seed))},
          neither of them calibrated on — the run above is one of them</em></span>
    </div>`, 1) : ''}

  ${rise('stage tall','',1)}

  ${rise('', `<details class=deep><summary>Against three reference matchers, on
    the same data</summary>
${base.present ? rise('bench', `
    <div class=bench-h><span>method</span><span>coverage — decided</span>
      <span>of panel</span><span>false proof — of those decided</span>
      <span>rate</span><span>correct</span></div>
    ${base.methods.map(m=>`<div class="bench-r${m.key==='attest'?' me':''}">
      <i>${esc(m.label)}</i>
      <span class=bench-t><u class="q cov" style="--w:${
        (m.decided/m.settlements||0).toFixed(3)}"></u></span>
      <b>${m.decided} / ${m.settlements}</b>
      <span class=bench-t><u class=q style="--w:${
        (m.false_proof||0).toFixed(3)}"></u></span>
      <b>${(m.false_proof*100).toFixed(1)}%</b>
      <em class=bench-ok>${m.decided - m.wrong}</em>
    </div>`).join('')}
    <div class=bench-note>
      <p class=bench-claim>More coverage is not more truth.</p>
      <p class=say style="max-width:60ch">Both bars are drawn on the same scale.
        <b>Greedy decides ${(base.methods.find(m=>m.key==='greedy')||{}).decided}
        of ${base.panel.settlements} and is wrong
        ${(base.methods.find(m=>m.key==='greedy')||{}).wrong} times</b>, so it
        ends with fewer correct decisions than ATTEST while moving far more
        money it could not prove. Exact-only is never wrong and decides
        ${(base.methods.find(m=>m.key==='exact_only')||{}).decided}. ATTEST does
        not claim the lowest error rate or the widest coverage — it claims the
        most decisions that were <b>warranted</b>. Read from
        <span class=mono>benchmark/baselines.json</span>.</p>
    </div>`, 3) : ''}
  </details>`, 2)}
</section>

<section id=ai>
  ${rise('row', mk(5,'why trust it','the boundary')
    + `<h2 class=chapter>The AI is advisory. The proof is not.</h2>`
    + `<div><p class=say>The advisor may propose and may be wrong. Verification
        is deterministic and recomputed from source. Policy is enforced
        independently of both. The ledger records nothing the verifier did not
        prove.</p></div>`)}

${rise('', `<figure class=sig>
    <div class=sig-h><i>measured model authority</i>
      <span>${esc(CASE)} · ${survivors} explanations · seed ${
        esc(String(run.seed))} · ${esc(basis)}</span></div>

    <div class="sig-r model"><i class=sig-gl></i>
      <span class=sig-a>Model<em>proposes</em></span>
      <span class=sig-v><b class=sig-o>${esc(
        ((inv.steps||[]).find(x=>x.actor==='model')||{}).input || '—')}</b>
        <span class=sig-w>An anchor — a guess at which of the ${survivors}
          explanations is the real one, from a capture-batch heuristic standing
          in the advisory slot. <b>Not a verdict, and structurally not eligible
          to become one:</b> it names orders, never an amount, and the engine
          below recomputes without reading it.</span></span></div>

    <div class="sig-r solver"><i class=sig-gl></i>
      <span class=sig-a>Solver<em>tests</em></span>
      <span class=sig-v><b class=sig-o>${esc(String(inv.tested??0))} tested ·
        ${esc(String(inv.discriminative??0))} discriminative</b>
        <span class=sig-w>${(inv.discriminative||0) === 0
          ? `The anchor was checked against the arithmetic and <b>isolated no
             explanation</b>. It separates nothing.`
          : `The anchor isolated a single explanation on
             ${inv.discriminative} of ${inv.tested} tests.`}</span></span></div>

    <div class="sig-r engine"><i class=sig-gl></i>
      <span class=sig-a>Engine<em>decides</em></span>
      <span class=sig-v><b class=sig-o>${esc(inv.verdict)}</b>
        <span class=sig-w>The verdict it already held, <b>computed without
          reading the model's</b>. Nothing downstream consumes the
          proposal.</span></span></div>

    ${inv.would_have_concluded ? `<div class=sig-cf>
      <div class=cf-c><span class=lbl>model concluded</span>
        <b>${esc(inv.would_have_concluded)}</b><em>diagnostic · discarded</em></div>
      <div class=sig-op>${inv.would_have_concluded === inv.verdict ? '=' : '≠'}</div>
      <div class=cf-c><span class=lbl>engine verdict</span>
        <b>${esc(inv.verdict)}</b><em>deterministic · retained</em></div>
    </div>` : ''}

    ${anch.resolved ? `<div class=sig-m>
      <div class=sig-mh><b>${anch.resolved} / ${anch.ambiguous}</b>
        <span>ambiguous cases the model could answer</span>
        <u>silent on ${(anch.silent_share*100).toFixed(0)}%</u></div>
      <div class=sig-ticks>${Array.from({length: anch.resolved}, (_, i) =>
        `<i class="sig-tk${i < anch.correct ? ' hit' : ''}"></i>`).join('')}</div>
      <p class=sig-mn>Held-out evaluation panel, read from
        <span class=mono>${esc(anch.source||'')}</span>. Each tick is one of the
        <b>${anch.resolved}</b> cases it spoke on; filled means it was right —
        <b>${anch.correct} of ${anch.resolved}</b>. On
        <b>${(anch.single_date_share*100).toFixed(0)}%</b> of candidate pools its
        lens — the densest same-day batch — is true of every order in the pool,
        so the anchor is an arbitrary pick wearing a rationale. A component that
        is silent on ${(anch.silent_share*100).toFixed(0)}% of the work and
        vacuous on half of the rest <b>does not get a vote on money</b> — which
        is why this one proposes and the engine decides.</p>
    </div>` : ''}

    <div class=sig-x><b>No financial action</b>
      <span>${inv.changed_nothing ? 'verdict unchanged' : 'verdict changed'} ·
        nothing posted · requires external evidence</span></div>
  </figure>`, 1)}

  ${inv.would_have_concluded && inv.would_have_concluded === inv.verdict ? rise('',
    `<p class=say style="margin-top:22px;max-width:64ch">On this settlement the
      two agree, and the agreement is a coincidence of the case rather than a
      mechanism. <b>The engine's verdict is produced without reading the
      model's</b>, so agreement and disagreement are equally
      inconsequential.</p>`, 2) : ''}

</section>

<section id=proofs>
  ${rise('', `<span class=lbl>and every one of those is measured, not
    asserted</span>`)}
${rise('proofs', `
    <div class=pf>
      <span class=lbl>independent proof</span>
      <b>${krn.present ? krn.lines : '—'}<i>line kernel</i></b>
      <p>${krn.present && krn.independent
        ? `The checker does not import the solver; the solver imports the
           checker. A bug in the search cannot also be the bug that waves its
           own answer through.`
        : `The checker's independence could not be read.`}</p>
    </div>
    <div class=pf>
      <span class=lbl>financial safety</span>
      <b>${claims.gates.filter(g=>g.state==='PASS').length}<i>of ${
        claims.gates.length} gates</i></b>
      <p>Integer paise end to end — no float ever touches money.
        ${adv.present ? `${adv.attacks} attempts to move money the engine
        should not move, ${adv.breached} succeeded.` : ''}</p>
    </div>
    <div class=pf>
      <span class=lbl>ai boundary</span>
      <b>${anch.resolved ? `${(anch.precision*100).toFixed(1)}%` : '—'}<i>${
        anch.resolved ? `${anch.correct} of ${anch.resolved}` : 'not measured'}</i></b>
      <p>Silent on most of the work it exists for, which is why the model
      proposes and never decides.
        Its conclusion is diagnostic only and nothing downstream reads it.</p>
    </div>
    <div class=pf>
      <span class=lbl>source boundary</span>
      <b>${iso.clean}<i>of ${iso.modules} modules</i></b>
      <p>Not one of the modules that produce a verdict names the provider. The
        adapter is read-only, the data is synthetic by design, and live account
        validation is <em>not verified</em>.</p>
    </div>`, 1)}
</section>

<section id=end>
  ${rise('', `<p class=ghost>Only evidence moves money.</p>`, 1)}
  ${rise('foot', `
    <p><b class=mono>${esc(String(run.settlements))}</b> settlements ·
      <b class=mono>${Number(run.orders).toLocaleString()}</b> orders ·
      <b class=mono>${esc(String(run.seed))}</b> seed · ${esc(basis)} ·
      ${esc(src.detail||'')}</p>
    <nav class=foot-n>
      <a href="https://github.com/kunalKumar-13/attest">GitHub <i>↗</i></a>
      <a class=door href="/app">Control room <i>↗</i></a>
      <a href="https://github.com/kunalKumar-13/attest/blob/main/docs/EVALUATION.md"
        >Evaluation <i>↗</i></a>
      <a href="https://github.com/kunalKumar-13/attest/blob/main/docs/ARCHITECTURE.md"
        >Architecture <i>↗</i></a>
    </nav>`, 1)}
</section>`;
    wire({counts:c, space, survivors,
          system:[src.label||'', (src.engine||{}).label||'',
                  `${run.settlements} settlements`].filter(Boolean)});
  }catch(e){
    main.innerHTML=`<section><p class=err>The engine did not answer, so this
      page has nothing to show. It does not keep a copy of the numbers.<br><br>
      ${esc(e.message)}</p></section>`;
  }
}
</script>
<script>
'use strict';
function wire(data){
  /* Selected by the section that owns them, not by document order. They were
     indexed [0] and [1], so moving the candidate field above the population
     field in the information architecture would silently give each the other's
     legend. An index is a fact about the document; an id is a fact about the
     thing being drawn. */
  const stages=[document.querySelector('#population .stage'),
                document.querySelector('#proof .stage')];
  const fields=[];

  /* The opening instrument's population. Deliberately outside the `.stage`
     list — it is the same primitive but a different job, and giving it that
     class silently handed it the config meant for the section below. It draws
     no legend: the three state buttons under it are the legend, and they say
     what each verdict MEANS rather than repeating its name. */
  const hero=document.getElementById('heroField');
  if(hero){
    const hf=Field(hero, {cell:18, lane:54, aspect:6,
      groups:[{n:data.counts.PROVEN,       tone:'proven', key:'proven'},
              {n:data.counts.AMBIGUOUS,    tone:'coral',  key:'ambiguous'},
              {n:data.counts.CONTRADICTED, tone:'ink', r:5, key:'contradicted'},
              {n:data.counts.INSUFFICIENT, tone:'dim',    key:'insufficient'}]
        .filter(g=>g.n>0)});
    fields.push([hero, hf]);
    /* Each state cell opens on hover or focus to say what the verdict MEANS
       rather than repeat its name. CSS does the disclosure; there is no
       handler here to leave dangling, and the copy is present without motion
       under reduced-motion and below 720px. */
  }
  /* Counts and labels come from the same group object that draws the points,
     so the legend cannot drift from the field. Nothing here is written down. */
  if(stages[0]) fields.push([stages[0], Field(stages[0], {cell:15, lane:56,
    groups:[{n:data.counts.PROVEN,       tone:'proven', label:'proven'},
            {n:data.counts.AMBIGUOUS,    tone:'coral',  label:'ambiguous'},
            {n:data.counts.CONTRADICTED, tone:'ink', r:4.5, label:'contradicted'},
            {n:data.counts.INSUFFICIENT, tone:'dim',   label:'insufficient'}]
      .filter(g=>g.n>0)})]);
  if(stages[1]) fields.push([stages[1], Field(stages[1], {cell:6, lane:60,
    groups:[{n:data.space.universe-data.space.candidates, tone:'dim', r:1.3,
             label:'cut by the reductions'},
            {n:data.space.candidates, tone:'ink', r:2, label:'candidates'},
            {n:data.survivors, tone:'lit', r:7, label:'explanations'}]
      .filter(g=>g.n>0)})]);

  if(!STILL){
    const rev=new IntersectionObserver(es=>{
      for(const e of es) if(e.isIntersecting){
        e.target.classList.add('in');
        const f=fields.find(([h])=>h===e.target||e.target.contains(h)||h.contains(e.target));
        if(f) f[1].show();
        rev.unobserve(e.target);
      }
    },{rootMargin:'0px 0px -6% 0px',threshold:.1});
    document.querySelectorAll('.rise').forEach(n=>rev.observe(n));
  } else {
    document.querySelectorAll('.rise').forEach(n=>n.classList.add('in'));
    fields.forEach(([,f])=>f.show());
  }
  addEventListener('resize',()=>fields.forEach(([,f])=>f.resize()),{passive:true});

  const nav=document.getElementById('index');
  nav.innerHTML=`<div class=grp>finance</div>`
    + NAV.map(([id,k,label])=>`<a href="#${id}" data-i="${id}"><span class=k>${
        k}</span>${esc(label)}</a>`).join('')
    + `<div class=grp>lifecycle</div>
       <div class=loop id=loop>${LOOP.map(([k,l])=>
         `<span data-stage="${k}"><i class=st></i>${esc(l)}</span>`).join('')}</div>`
    + `<div class=grp>system</div><div class=sys id=sysline></div>`;
  const sysline = document.getElementById('sysline');
  if (sysline) sysline.innerHTML = (data.system || []).map(esc).join('<br>');
  const links=new Map([...nav.querySelectorAll('a')].map(a=>[a.dataset.i,a]));

  const ratio=new Map();
  const here=new IntersectionObserver(es=>{
    for(const e of es) ratio.set(e.target.id, e.isIntersecting?e.intersectionRatio:0);
    let id=null,best=0;
    for(const [k,v] of ratio) if(v>best){best=v;id=k;}
    if(!id) return;
    links.forEach((a,k)=>a.classList.toggle('on',k===id));
    const st = STAGE[id];
    document.querySelectorAll('#loop span').forEach(n=>
      n.classList.toggle('on', n.dataset.stage === st));
  },{rootMargin:'-40% 0px -40% 0px',threshold:[0,.1,.3,.6,1]});
  [...NAV.map(x=>x[0]), ...Object.keys(STAGE)].forEach(id=>{
    const el=document.getElementById(id); if(el && !ratio.has(id)) here.observe(el);});

  const at=location.hash.replace('#','');
  if(at&&document.getElementById(at))
    document.getElementById(at).scrollIntoView({behavior:'auto'});
}
build();
</script>

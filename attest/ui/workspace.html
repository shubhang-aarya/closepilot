<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>ATTEST — workspace</title>
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel=stylesheet>
<style>
:root{
  /* ══════════════════════════════════════════ THE INSTRUMENT ROOM
     Same world as the front door, measured off the reference's DARK
     rendering: canvas rgb(14,14,14), surface rgb(17,17,17), coral
     rgb(255,101,90) for what is unresolved, and a lime reserved for actions.

     What changes between the two surfaces is DENSITY, not identity. The
     investigation is a reading; this is the instrument. An instrument may be
     dense. It may not be a different product.

     Colour still says three things and no more: coral is unresolved or
     refused, green is proved, lime is an action you can take. Everything else
     is white at some opacity. */
  --bg:#0e0e0e;
  --sur:#141414;
  --sur2:#191919;
  --sur3:#202020;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.20);
  --ink:#ffffff;
  --dim:rgba(255,255,255,.68);
  --dim2:rgba(255,255,255,.52);
  --dim3:rgba(255,255,255,.38);
  --acc:#dcf23c;  --acc-d:rgba(220,242,60,.12);
  --rail-bg:#111111;
  --hov:rgba(255,255,255,.05);
  --st-PROVEN:#5fbf9b;       --st-PROVEN-bg:rgba(95,191,155,.12);
  --st-AMBIGUOUS:#e8a13c;    --st-AMBIGUOUS-bg:rgba(232,161,60,.12);
  --st-CONTRADICTED:#ff655a; --st-CONTRADICTED-bg:rgba(255,101,90,.12);
  --st-INSUFFICIENT:rgba(255,255,255,.52); --st-INSUFFICIENT-bg:rgba(255,255,255,.06);
  --st-SYSTEMIC:#5fbf9b;     --st-SYSTEMIC-bg:rgba(95,191,155,.12);
  --st-INVESTIGATE:#7aa2ff;  --st-INVESTIGATE-bg:rgba(122,162,255,.12);
  --shadow:none;
  --s:"Space Grotesk",ui-sans-serif,-apple-system,system-ui,sans-serif;
  --m:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* ------------------------------------------------------------- TYPE
     Six named roles. The audit found NINE sizes in use with two accidental
     pairs — 13/13.5 and 8.5/9 — which are not decisions, they are the
     residue of choosing at the call site. Everything below resolves to one
     of six, and the old names are kept as aliases so no rule has to be
     rewritten to obey the scale.

     DATA is a role, not a size: financial values are the subject of this
     product and must never render as body copy. */
  --type-display:34px;   /* the case amount, once per screen */
  --type-title:20px;     /* identity, the lens's headline */
  --type-data:15px;      /* figures inside a composition */
  --type-body:13px;      /* statements, row content */
  --type-label:11px;     /* small-caps section labels */
  --type-micro:10px;     /* provenance, timestamps, counts */

  --t-micro:var(--type-micro); --t-label:var(--type-label);
  --t-small:var(--type-label); --t-body:var(--type-body);
  --t-lead:var(--type-data);   --t-h3:var(--type-title);
  --t-h2:var(--type-title);    --t-num:var(--type-display);
  --t-hero:var(--type-display);

  /* ----------------------------------------------------------- SPACING
     Eight steps on a 4px base, replacing 4/6/9/13/19/27/38 — a geometric
     drift where no two steps shared a relationship. A component that needs
     a ninth value is a component that is structurally wrong. */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;
  --s-1:var(--sp-1); --s-2:var(--sp-2); --s-3:var(--sp-2); --s-4:var(--sp-3);
  --s-5:var(--sp-5); --s-6:var(--sp-6); --s-7:var(--sp-8);

  /* ------------------------------------------------------------ RADII
     Two. Six were in use. A row is not a card; a separator is not a chip. */
  --r-sm:4px;            /* controls, small interactive elements */
  --r-lg:8px;            /* contextual surfaces */
  --r-0:var(--r-sm); --r-1:var(--r-sm); --r-2:var(--r-lg);
  --r-3:var(--r-lg); --r-4:var(--r-lg); --r-full:999px;

  /* ----------------------------------------------------------- MOTION
     Three tiers. Two existed, and the spatial one — an object opening out
     of the row that owns it — ran on the same token as a hover tint. */
  --micro:.12s cubic-bezier(.2,0,0,1);      /* interaction feedback */
  --standard:.2s cubic-bezier(.2,0,0,1);    /* lens and state change */
  --spatial:.3s cubic-bezier(.16,1,.3,1);   /* context open and close */
  --fast:var(--micro); --med:var(--standard);
}
/* Light remains reachable for anyone who needs it, but it is no longer a
   switch in the primary interaction path: the first control on the page should
   never be a question about the product's appearance. */
/* Dark is still reachable with ?theme=dark for anyone who wants it, but it is
   not the product: the family this is drawn from is paper. */
/* Light remains reachable with ?theme=light. It is not the product. */
:root[data-theme=light]{
  --bg:#f2f1ec; --sur:#fbfaf7; --sur2:#eeece5; --sur3:#e4e2d9;
  --line:rgba(18,19,15,.13); --line2:rgba(18,19,15,.26);
  --ink:#12130f; --dim:#55564e; --dim2:#666760; --dim3:#676860;
  --acc:#b4462a; --acc-d:rgba(180,70,42,.09);
  --rail-bg:#edebe4; --hov:rgba(18,19,15,.04);
  --st-PROVEN:#2f6b4f;       --st-PROVEN-bg:rgba(47,107,79,.09);
  --st-AMBIGUOUS:#8a5f1c;    --st-AMBIGUOUS-bg:rgba(138,95,28,.10);
  --st-CONTRADICTED:#b4462a; --st-CONTRADICTED-bg:rgba(180,70,42,.09);
  --st-INSUFFICIENT:#666760; --st-INSUFFICIENT-bg:rgba(18,19,15,.05);
  --st-SYSTEMIC:#2f6b4f;     --st-SYSTEMIC-bg:rgba(47,107,79,.09);
  --st-INVESTIGATE:#2f5aa8;  --st-INVESTIGATE-bg:rgba(47,90,168,.09);
  --shadow:none;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:var(--type-body)/1.55 var(--s);
-webkit-font-smoothing:antialiased;overflow:hidden}
/* Type and colour were reset here; background and border were not, so every
   control that did not paint its own surface inherited Chromium's buttonface
   grey and a 2px outset border. The instrument dock's own stylesheet describes
   'a seated indent against the rail edge rather than a filled chip' — that
   design had never once rendered. A control in this product is a surface it
   chose, or no surface at all. */
button{font:inherit;color:inherit;background:transparent;border:0;
  border-radius:0;padding:0;text-align:inherit}

/* --------------------------------------------------------------- app shell */
/* ============================================================== THE FRAME
   THE CASE IS THE OBJECT. THE RAIL IS THE CASE. THE INSTRUMENT IS THE ROOM.

   The autopsy measured 343px of identical chrome stacked above every
   instrument, squeezing it into 533px of a 900px viewport. The case turns 90
   degrees: written once into a rail, never re-rendered, and the room starts
   at y=0 with the full height.

   The rail is a tax and has to earn every pixel, so its width was measured
   rather than chosen. At 240/256/272 the rail overflows by 36/20/4px. At 288
   it does not overflow, but the portfolio total is silently CLIPPED — the
   amount's natural width is 255px and only 247px is available, and clipping
   the primary financial object to save eight pixels is not a trade worth
   making.

   296px is the smallest width that renders ₹53,02,701.96 in full at 34px
   with the 20px gutters. The rail is therefore sized by the largest amount
   the product must display, which is the right thing for it to be sized by. */
:root{--rail:296px}
#app{display:grid;
  grid-template-columns:var(--rail) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) auto auto;
  grid-template-areas:"case room" "inst room" "bar room";
  height:100vh;min-height:0}
#app>*{min-width:0}
#subject{grid-area:case;overflow-y:auto;overflow-x:hidden}
#lenses{grid-area:inst}
#bar{grid-area:bar}
#workspace{grid-area:room}
#foot{display:none}          /* the rail says what the foot used to */

/* Secondary controls. Moved out of the primary interaction path — the first
   interactive element on the page was the theme toggle, which is a statement
   about what the product thinks it is for. */
/* wraps rather than overflows: the bar carries the source and the execution
   path, and a 360px phone cannot hold both on one line beside the run
   controls. Neither fact is worth dropping to save a row. */
#bar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
height:auto;border-top:1px solid var(--line);background:var(--rail-bg)}
#bar .wm{opacity:.55}
#bar #hint{display:none}
#bar .wm{font-family:var(--m);font-weight:700;letter-spacing:.2em;
font-size:var(--t-small)}
#bar .sp{flex:1}
.btn{background:var(--sur);border:1px solid var(--line);border-radius:var(--r-2);
padding:5px 11px;font-size:var(--t-label);cursor:pointer;color:var(--dim2)}
.btn:hover{color:var(--ink);border-color:var(--line2)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#fff}
#hint{font-size:var(--t-micro);color:var(--dim3);font-family:var(--m)}

/* subject header — patched, never re-rendered */
/* Wraps deliberately: the meta line belongs under the identity, not squeezed
   beside it. Without wrap a 100%-width meta row crushed the label to an
   ellipsis, which is the one thing a subject header may never do. */
/* ---------------------------------------------------------- THE CASE RAIL
   Not a sidebar and not navigation. It answers: what am I looking at, how
   much, what state is it in, where did the money stop, what is agreed, what
   is disputed, what should I do. The instrument answers a different
   question — which one is being asked. */
.c-subject{background:var(--rail-bg);border-right:1px solid var(--line)}
.c-case{display:flex;flex-direction:column;gap:var(--sp-4);
  padding:var(--sp-5) var(--sp-5) var(--sp-3)}

/* 1. the amount — the financial subject, and unmistakably the largest thing */
.c-case-amt .v{display:block;font-family:var(--m);
  font-variant-numeric:tabular-nums;font-size:var(--type-display);
  letter-spacing:-.035em;line-height:1;font-weight:500}
.c-case-amt .k{display:block;font-size:var(--type-micro);color:var(--dim3);
  letter-spacing:.13em;text-transform:uppercase;margin-top:var(--sp-1)}

/* 2. verdict, 3. identity */
.c-case-id{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp-2);
  margin-top:calc(var(--sp-4) * -1 + var(--sp-2))}
.c-case-id .lbl{font-size:var(--type-title);font-weight:600;letter-spacing:-.02em;
  line-height:1.15;order:2;flex-basis:100%}
.c-case-id .st{order:1}
.c-case-id .sub{order:3;font-size:var(--type-micro);color:var(--dim3);
  letter-spacing:.12em;text-transform:uppercase}
.c-case-meta{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);
  font-size:var(--type-micro);color:var(--dim3);font-family:var(--m)}
.c-case-meta i{font-style:normal;letter-spacing:.1em;text-transform:uppercase;
  margin-right:4px;opacity:.7}

/* 4/5/6 — the state, what is agreed, what to do */
.c-slot{border-top:1px solid var(--line);padding-top:var(--sp-3)}
.c-slot[hidden],.c-slot:empty{display:none}
/* Agreed and disputed are one fact in two halves — what every explanation
   settles, and what they argue over. Stacking them pushed the disputed amount
   and the next action off the bottom of the rail on a 900px screen. */
.c-now{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.c-fact{display:grid;grid-template-columns:1fr;gap:1px;padding-bottom:var(--sp-3)}
.c-now .c-fact{padding-bottom:0}
.c-fact:last-child{padding-bottom:0}
.c-fk{font-size:var(--type-micro);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim3)}
.c-fv{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-data);font-weight:500}
.c-fact.hot .c-fv{color:var(--st-CONTRADICTED)}
.c-fact em{font-style:normal;font-size:var(--type-micro);color:var(--dim3)}
.c-nx-w{font-size:var(--type-body);line-height:1.4;padding-top:2px}
.c-nx-v{padding-top:var(--sp-2)}
.c-nx-v b{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-data);color:var(--st-PROVEN)}
.c-nx-v em{display:block;font-style:normal;font-size:var(--type-micro);color:var(--dim3)}

/* the spine, in the rail, as part of the case's identity
   ------------------------------------------------------------------
   §6. Money is the subject of this product and had been rendering as
   annotation: the stage names, the continuing value and the held value all
   sat at 9-10px, so ₹48,03,127.81 stopped at verification was painted the
   same size as the word beside it and two sizes below a ₹6,316 blocker.

   The three amounts in a spine row are three different facts and now read as
   three different roles:

     MONEY THAT CONTINUES   the stage value          13px  mono
     MONEY THAT STOPPED     the held value           15px  mono, stop colour
     the stage it stopped at  label                  10px  small caps

   Nothing was added. The row is the same three spans it always was. */
.c-state .c-flow{gap:0}
.c-state .c-flow-r{grid-template-columns:78px minmax(24px,1fr) auto;
  gap:var(--sp-1) var(--sp-2);padding:var(--sp-1) 0;align-items:center}
.c-state .c-flow-n{grid-column:1;grid-row:1;font-size:var(--type-micro)}
.c-state .c-flow-track{grid-column:2;grid-row:1;height:8px;max-width:none}
/* the money that CONTINUES sits on the stage's own line, not under it — three
   stacked lines per stage left the rail with no room for the next action */
.c-state .c-flow-v{grid-column:3;grid-row:1;text-align:right;
  font-size:var(--type-body);padding-bottom:0;white-space:nowrap}
.c-state .c-flow-x{grid-column:1/4;grid-row:2;font-size:var(--type-micro);
  padding-bottom:var(--sp-1)}
/* a stage that held nothing has nothing to annotate — three of five rows were
   reserving a line for an empty span */
.c-state .c-flow-x:empty,.c-state .c-flow-v:empty{display:none}
/* The held amount is the money that STOPPED — the answer to the one question
   the landing exists to answer. §10 asks the first viewport to say

       MONEY STOPPED AT
       VERIFICATION
       ₹48,03,127.81 HELD

   which the spine already says: a stage name, in the stop colour, carrying the
   amount. It was saying it at 9px. Rather than repeat the sentence in a second
   block — the duplication this phase found in Policy — the row that already
   states it is given the weight of a statement. */
/* Every ₹ role declares tabular figures so digits hold their column. This one
   did not, and it carries the answer to where the money stopped. */
.c-state .c-flow-h{font-size:var(--type-title);letter-spacing:-.02em;
  font-weight:500;font-variant-numeric:tabular-nums}
.c-state .c-flow-r.stopped .c-flow-n{color:var(--ink);font-weight:500}
.c-state .c-flow-d{display:none}
/* ------------------------------------------------- §22.10 THE PROOF CHAIN
   The spine is the one object that states the whole model, and it was inert.
   Each stage is now the way into the instrument that owns it, and each room
   marks the segment it is talking about on the spine the shell already draws
   rather than drawing a second one.

   The mark is a rule down the left edge — the same device the search-space
   reductions use for deterministic-versus-convention — not a fill, because a
   filled row in a column of five reads as a selected menu item. */
.c-state .c-flow-r{position:relative;width:100%;text-align:left;
  border-left:2px solid transparent;padding-left:var(--sp-2);
  margin-left:calc(var(--sp-2) * -1);
  transition:background var(--micro),border-color var(--micro)}
/* A lit stage carries a solid rule; a stage you can open carries the same rule
   at a quarter weight. The affordance and the state share one language, so the
   spine needs no icon and no chevron to say it is navigable. */
.c-state button.c-flow-r{cursor:pointer;border-left-color:var(--line)}
.c-state button.c-flow-r:hover{background:var(--sur2);
  border-left-color:var(--dim2)}
.c-state button.c-flow-r:hover .c-flow-n{color:var(--ink)}
.c-state button.c-flow-r:focus-visible{outline:2px solid var(--acc);
  outline-offset:-2px}
.c-state .c-flow-r.lit{border-left-color:var(--ink)}
.c-state .c-flow-r.lit .c-flow-n{color:var(--ink);font-weight:500}



/* lens strip — an instrument, not browser tabs */
/* --------------------------------------------- THE RAIL ON A SMALL SCREEN
   A 296px rail against a 360px viewport leaves the instrument 40px, which is
   not a narrow layout, it is a broken one. Below 768px the rail becomes a
   compact case BAND — identity, amount, verdict, and the stage model reduced
   to marks — and the instrument gets the rest. Not the old giant header: the
   band is one or two lines, and the full financial state is a scroll away
   inside it rather than a wall above the room. */
@media (max-width:767px){
  :root{--rail:100%}
  #app{grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"case" "room" "inst" "bar"}
  /* The band is capped so the instrument keeps the majority of a phone
     screen. Agreed, disputed and the next action scroll INSIDE it rather
     than being dropped — a phone is a smaller window on the case, not a
     different case. */
  #subject{border-right:0;border-bottom:1px solid var(--line);
    max-height:25vh;overflow-y:auto}
  .c-case{padding:var(--sp-3) var(--sp-4);gap:var(--sp-2);
    display:grid;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"id amt" "meta meta" "state state" "now now" "next next"}
  .c-case-amt{grid-area:amt;text-align:right}
  .c-case-amt .v{font-size:var(--type-title)}
  .c-case-id{grid-area:id;margin-top:0}
  .c-case-id .lbl{flex-basis:auto;font-size:var(--type-body)}
  .c-case-meta{grid-area:meta}
  .c-state{grid-area:state} .c-now{grid-area:now} .c-next{grid-area:next}
  /* The stage model must survive to a phone — it is the one thing that must
     not be dropped. Five columns across 360px overlapped their own labels, so
     it stays a list and gets tighter instead: name, bar, figure on one line,
     and only the stage that stopped keeps its sentence. */
  .c-state .c-flow{display:flex;flex-direction:column;gap:0}
  .c-state .c-flow-r{grid-template-columns:62px minmax(0,1fr) auto;
    gap:var(--sp-2);padding:2px 0;align-items:center}
  .c-state .c-flow-n{grid-column:1;grid-row:1}
  .c-state .c-flow-track{grid-column:2;grid-row:1;height:7px}
  .c-state .c-flow-v{grid-column:3;grid-row:1;font-size:var(--type-micro);text-align:right}
  .c-state .c-flow-x{display:none}
  .c-state .c-flow-r.stopped .c-flow-x{display:block;grid-column:1/4;grid-row:2;
    font-size:var(--type-micro);padding-bottom:2px}
  .c-now,.c-next{display:flex;gap:var(--sp-5);flex-wrap:wrap}
  .c-fact{padding-bottom:0}
  .c-lenses{grid-area:inst}
  #bar{grid-area:bar}
}

/* ======================================== TRUST · SYSTEM INTEGRITY CONSOLE
   Four zones: what is not claimed, what is demonstrated, what broke, what
   produced this. The NOT VERIFIED zone is deliberately the strongest — a
   surface that leads with its passes is a trophy wall, and the whole reason
   this lens exists is to say what the system will not assert. */
.t-bounds{display:flex;flex-direction:column}
.t-bound{display:grid;grid-template-columns:100px 292px minmax(0,1fr);
  gap:var(--sp-4);align-items:baseline;padding:var(--sp-2) 0;
  border-top:1px solid var(--line)}
.t-bound:first-child{border-top:0}
.t-bound-s{font-size:var(--type-micro);letter-spacing:.14em;color:var(--st-CONTRADICTED);
  border:1px solid var(--st-CONTRADICTED);border-radius:var(--r-sm);
  padding:2px 5px;text-align:center}
.t-bound-w{font-size:var(--type-body);font-weight:600}
.t-bound-y{font-size:var(--type-micro);color:var(--dim2);line-height:1.5}

/* assertions, not KPI cards: a claim, its state, and what stands behind it */
.t-asserts{display:flex;flex-direction:column;padding-bottom:var(--sp-5)}
.t-assert{display:grid;grid-template-columns:150px 168px minmax(0,1fr);
  gap:var(--sp-4);align-items:baseline;padding:var(--sp-2) 0;
  border-top:1px solid var(--line)}
.t-assert:first-child{border-top:0}
.t-assert-k{font-size:var(--type-micro);letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim3)}
.t-assert-v{font-family:var(--m);font-size:var(--type-body);font-weight:500;
  color:var(--st-PROVEN);letter-spacing:.04em}
.t-assert-w{font-size:var(--type-micro);color:var(--dim2)}

/* failure lifecycle — found, reproduced, fixed, tested */
.t-traces{display:flex;flex-direction:column;gap:var(--sp-5)}
.t-trace{border-left:2px solid var(--line2);padding-left:var(--sp-4)}
.t-trace-h{display:flex;align-items:baseline;gap:var(--sp-3);padding-bottom:var(--sp-2)}
.t-trace-id{font-family:var(--m);font-size:var(--type-micro);letter-spacing:.1em;
  color:var(--dim3)}
.t-trace-h b{font-size:var(--type-body);font-weight:600}
.t-life{list-style:none;display:flex;flex-wrap:wrap;gap:0;margin:0;padding:0 0 var(--sp-2)}
.t-life li{font-size:var(--type-micro);letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim3);padding:2px var(--sp-3) 2px 0;position:relative}
.t-life li:not(:last-child)::after{content:"→";padding-left:var(--sp-2);opacity:.5}
.t-life li.on{color:var(--st-PROVEN)}
.t-life li:not(.on){color:var(--st-AMBIGUOUS)}
.t-trace-w{font-size:var(--type-micro);color:var(--dim);line-height:1.55;
  max-width:78ch}
.t-trace-r{font-family:var(--m);font-size:var(--type-micro);color:var(--dim3);padding-top:var(--sp-2)}

/* provenance — a vertical chain, versions on the right */
.t-prov{list-style:none;display:flex;flex-direction:column;margin:0;padding:0}
.t-prov-s{display:grid;grid-template-columns:132px minmax(0,1fr) auto;
  gap:var(--sp-4);align-items:baseline;padding:var(--sp-2) 0;
  border-top:1px solid var(--line);position:relative}
.t-prov-s:first-child{border-top:0}
.t-prov-s::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;
  background:var(--line2)}
.t-prov-s:first-child::before{top:50%} .t-prov-s:last-child::before{bottom:50%}
.t-prov-s::after{content:"";position:absolute;left:2px;top:calc(50% - 3px);
  width:7px;height:7px;border-radius:50%;background:var(--dim3)}
.t-prov-k{padding-left:var(--sp-5);font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3)}
.t-prov-w{font-size:var(--type-micro);color:var(--dim)}
.t-prov-v{font-family:var(--m);font-size:var(--type-micro);color:var(--ink);
  text-align:right}
.t-prov-n{font-size:var(--type-micro);color:var(--dim2);padding-top:var(--sp-3);
  max-width:70ch;line-height:1.5}

.c-lever{display:flex;flex-direction:column}
.c-lever-r{display:grid;grid-template-columns:84px 104px minmax(0,1fr) 132px 96px;
  gap:var(--sp-4);align-items:baseline;padding:var(--sp-2) 0;
  border-top:1px solid var(--line)}
.c-lever-k{font-size:var(--type-micro);letter-spacing:.13em;text-transform:uppercase;color:var(--dim3)}
.c-lever-c{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-data)}
.c-lever-n{font-size:var(--type-micro);color:var(--dim)}
.c-lever-n b{font-family:var(--m);font-size:var(--type-body);color:var(--ink)}
.c-lever-v{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-micro);text-align:right;color:var(--dim2)}
.c-lever-w{font-size:var(--type-micro);letter-spacing:.1em;color:var(--dim3);text-align:right}
.c-lever-w .bad{color:var(--st-CONTRADICTED)}
.c-lever-r.alt .c-lever-c,.c-lever-r.alt .c-lever-n b{color:var(--dim2)}
.c-lever-p{font-size:var(--type-micro);color:var(--dim2);line-height:1.5;
  padding-top:var(--sp-3);max-width:76ch}
.c-lever-p b{font-family:var(--m);font-size:var(--type-micro);color:var(--dim)}
.c-sim-tag{font-size:var(--type-micro);letter-spacing:.11em;color:var(--st-AMBIGUOUS);
  border:1px dashed var(--st-AMBIGUOUS);border-radius:var(--r-sm);padding:1px 5px}

/* CONTROL · THE BLOCKERS — evidence objects rather than a grid; see
   §30.2 at the foot of this stylesheet. The old grid was retired WITH it
   rather than left behind to win cascade fights against its replacement:
   `width:112px` on the label spans outlived the rebuild and blew a 112px hole
   into "blocked at | verification". Superseded CSS is not inert. */

/* the working population a blocker scopes to */
.c-pop-h{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;
  padding-bottom:var(--sp-3)}
.c-pop-v{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-title)}
.c-pop-w{font-size:var(--type-micro);color:var(--dim2);max-width:72ch;
  line-height:1.5;padding-bottom:var(--sp-4)}
.c-pop{display:flex;flex-direction:column}
.c-pop-r{display:grid;grid-template-columns:18px 116px 132px minmax(0,1fr) 16px;
  gap:var(--sp-3);align-items:baseline;width:100%;text-align:left;
  padding:var(--sp-2);border-top:1px solid var(--line);border-radius:var(--r-sm)}
.c-pop-r:hover{background:var(--sur2)}
.c-pop-id{font-family:var(--m);font-size:var(--type-micro)}
.c-pop-a{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-body);text-align:right}
.c-pop-n{font-size:var(--type-micro);color:var(--dim3)}
.c-pop-go{color:var(--dim3);text-align:right}

/* the blocker a case came from, carried as a contextual parent */
.c-from{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;
  font-size:var(--type-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--dim3);
  padding-bottom:var(--sp-3)}
.c-from b{font-family:var(--m);font-size:var(--type-micro);letter-spacing:0;
  text-transform:none;color:var(--dim)}
.c-from .v{font-family:var(--m);color:var(--ink);letter-spacing:-.02em}
.c-from-x{color:var(--dim3)}

@media (max-width:1023px){
  .c-pop-r{grid-template-columns:16px minmax(0,1fr) auto}
  .c-pop-n{display:none}
}

/* ============================================== JOURNAL · ACCOUNTING ROOM
   A vertical chain of financial movement, then what the books actually did.
   Accounting columns and hairlines — no cards. The zeroes are the point. */
.j-mv{list-style:none;display:flex;flex-direction:column;margin:0;padding:0}
.j-mv-s{display:grid;grid-template-columns:168px minmax(0,1fr) auto;
  gap:var(--sp-4);align-items:baseline;padding:var(--sp-3) 0;
  border-top:1px solid var(--line);position:relative}
.j-mv-s:first-child{border-top:0}
/* the chain: each stage hangs off the one above it */
.j-mv-s::before{content:"";position:absolute;left:8px;top:0;bottom:0;
  width:1px;background:var(--line2)}
.j-mv-s:first-child::before{top:50%}
.j-mv-s:last-child::before{bottom:50%}
.j-mv-s::after{content:"";position:absolute;left:5px;top:calc(50% - 3px);
  width:7px;height:7px;border-radius:50%;background:var(--sur);
  border:1px solid var(--line2)}
.j-mv-s.through::after{background:var(--st-PROVEN);border-color:var(--st-PROVEN)}
.j-mv-s.stopped::after{background:var(--st-AMBIGUOUS);border-color:var(--st-AMBIGUOUS)}
.j-mv-s.blocked::after{background:var(--sur);border-color:var(--line2)}
.j-mv-k{padding-left:var(--sp-5);font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3)}
.j-mv-s.stopped .j-mv-k{color:var(--st-AMBIGUOUS)}
.j-mv-w{font-size:var(--type-body);color:var(--dim)}
.j-mv-v{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-data);text-align:right}
.j-mv-s.blocked .j-mv-w{color:var(--dim3)}
.j-mv-x{font-family:var(--s);font-size:var(--type-micro);letter-spacing:.13em;
  color:var(--dim3);border:1px dashed var(--line2);border-radius:var(--r-sm);
  padding:2px 6px}
.j-mv-w2,.j-mv-w{}
.j-mv-a,.j-mv-d{font-family:var(--s);font-size:var(--type-micro);
  letter-spacing:.13em}
.j-mv-a{color:var(--st-PROVEN)} .j-mv-d{color:var(--st-AMBIGUOUS)}
.j-mv-s .j-mv-w[data-x]{}
.j-mv-s.through .j-mv-v{color:var(--ink)}

/* the ledger effect — three accounting rows, right-aligned like a book */
/* rebuilt as evidence objects · §30.6, at the foot of this stylesheet */

/* entry status — fixed questions, short answers, no prose */
.j-st{display:flex;flex-direction:column;margin:0}
.j-st-r{display:grid;grid-template-columns:180px minmax(0,1fr);gap:var(--sp-4);
  padding:var(--sp-2) 0;border-top:1px solid var(--line);align-items:baseline}
.j-st-r dt{font-size:var(--type-micro);letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim3);margin:0}
.j-st-r dd{margin:0;font-size:var(--type-body);color:var(--dim)}
.j-st-r.t-stop dd{color:var(--st-CONTRADICTED);font-weight:600}
.j-st-r.t-go dd{color:var(--st-PROVEN);font-weight:600}

/* ------------------------------------------------------ THE ROOM'S ANSWER
   The instrument's conclusion, first and largest. The autopsy found the
   lens's own answer outside the top three by visual weight on six of seven
   lenses; on Policy the word REVIEW lost to the application's name. */
.c-concl{padding-bottom:var(--sp-6);max-width:74ch}
.c-concl-f{font-size:var(--type-title);font-weight:600;letter-spacing:-.02em;
  line-height:1.2}
.c-concl-n{display:flex;align-items:baseline;gap:var(--sp-3);padding-top:var(--sp-2)}
/* the subordinate figure sits at the agreed/disputed tier the type audit
   assigned it — present, aligned under the headline, never competing with it */
.c-concl-2{display:flex;align-items:baseline;gap:var(--sp-3);padding-top:var(--sp-1)}
.c-concl-2 b{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-data);font-weight:500;color:var(--dim)}
.c-concl-2 em{font-style:normal;font-size:var(--type-micro);letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim3)}
.c-concl-n b{font-family:var(--m);font-variant-numeric:tabular-nums;
  font-size:var(--type-display);font-weight:500;letter-spacing:-.035em;line-height:1}
.c-concl-n em{font-style:normal;font-size:var(--type-micro);color:var(--dim3);
  letter-spacing:.12em;text-transform:uppercase}
.c-concl-w{font-size:var(--type-body);color:var(--dim);line-height:1.5;
  padding-top:var(--sp-3);max-width:68ch}
.t-stop .c-concl-f{color:var(--st-CONTRADICTED)}
.t-hold .c-concl-f{color:var(--st-AMBIGUOUS)}
.t-go .c-concl-f{color:var(--st-PROVEN)}
.t-stop .c-concl-n b{color:var(--st-CONTRADICTED)}

/* --------------------------------------------------- §22.7 THE NEXT QUESTION
   One line at the foot of the room, not a banner and not a call to action. It
   states what the next instrument would answer; the operator may ignore it and
   the loop still works from the dock. On Trust it is absent — there is no
   destination after "what can I believe", and inventing one would make the
   product feel like it is steering. */
.c-onward{display:flex;align-items:baseline;gap:var(--sp-3);width:100%;
  margin-top:var(--sp-7);padding:var(--sp-4) 0 var(--sp-2);
  border-top:1px solid var(--line);text-align:left;cursor:pointer;
  transition:border-color var(--micro)}
.c-onward:hover{border-top-color:var(--ink)}
.c-onward-k{font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3);flex:0 0 auto}
.c-onward-q{font-size:var(--type-data);color:var(--ink);flex:1 1 auto}
.c-onward-l{font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim2)}
.c-onward-x{font-family:var(--m);color:var(--dim3);
  transition:transform var(--micro),color var(--micro)}
.c-onward:hover .c-onward-x{transform:translateX(3px);color:var(--ink)}
.c-onward:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* --------------------------------------------------- THE SOURCE MODE
   On every screen, at the lowest weight that is still readable. It says where
   the records came from, and it is read from the adapter rather than written
   here — an environment without credentials cannot render anything but
   GENERATED. Silence is not a label, and the difference between generated data
   and a live account is the difference between a demonstration and a claim. */
#source-mode{font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3);white-space:nowrap;
  padding-left:var(--sp-3);border-left:1px solid var(--line);
  margin-left:var(--sp-1)}
#source-mode.live{color:var(--st-PROVEN)}
#source-mode:empty{display:none}
/* Which envelope produced the figures. Two installs of the same commit give
   different answers — both honest — and a reader comparing a screen against a
   recording needs to know which one they have. */
#exec-path{font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3);white-space:nowrap;
  padding-left:var(--sp-3);border-left:1px solid var(--line);
  margin-left:var(--sp-1)}
#exec-path:empty{display:none}

/* -------------------------------------------------- THE INSTRUMENT DOCK
   Measured diagnosis of why the old one read as navigation: seven items of
   IDENTICAL width in a uniform grid, labelled with nouns and nothing else,
   distinguished only by weight, with a filled block for the selection. Every
   one of those is a menu convention.

   So none of them survive. Items are a single column of unequal height; the
   held instrument states its QUESTION and the others do not; selection is a
   seated indent against the rail edge rather than a filled chip. A menu names
   places. An instrument says what it asks. */
.c-lenses{grid-area:inst;display:flex;flex-direction:column;gap:0;
  padding:var(--sp-2) 0 var(--sp-2);border-top:1px solid var(--line);
  background:var(--rail-bg)}
.c-lenses button{display:block;width:100%;padding:3px var(--sp-5);
  border-left:2px solid transparent;text-align:left;
  transition:color var(--micro),border-color var(--micro),background var(--micro)}
.c-lenses button{position:relative}
/* the ordinal: an anchor, set back from the name so it reads as an index
   rather than as part of the instrument's title */
.c-lens-i{position:absolute;left:var(--sp-2);top:var(--sp-2);
  font-family:var(--m);font-size:var(--type-micro);color:var(--line);
  letter-spacing:.06em}
.c-lenses button{padding-left:var(--sp-8)}
.c-lens-n{display:block;font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3)}
/* what this instrument currently answers — the smallest thing in the dock,
   because it is a report and not a label */
.c-lens-s{display:block;font-family:var(--m);font-size:var(--type-micro);
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim3);
  opacity:.75;padding-top:2px}
.c-lenses button.on .c-lens-s{color:var(--dim);opacity:1}
/* Every instrument states what it asks. Hiding the question on all but the
   held one left six bare nouns — the menu convention this dock was built to
   avoid. The held one is distinguished by seating and weight, not by being
   the only one that says anything. */
.c-lens-q{display:block;font-size:var(--type-micro);color:var(--dim3);
  line-height:1.35;padding-top:1px}
/* the held instrument: seated against the rail's edge, and it is the only one
   that says what it asks */
.c-lenses button.on{border-left-color:var(--ink);background:var(--sur);
  padding-top:var(--sp-2);padding-bottom:var(--sp-2)}
.c-lenses button.on .c-lens-q{color:var(--dim)}
.c-lenses button.on .c-lens-n{color:var(--ink);font-weight:600}
.c-lenses button:hover{background:var(--sur)}
.c-lenses button:hover .c-lens-n{color:var(--dim)}

/* --------------------------------------------------- THE DOCK ON A PHONE
   Four columns was chosen when an instrument was a single label. Once every
   instrument states its question each item is two lines, so seven across four
   columns is two rows of ~130px — measured at 360x780 as a 263px dock against
   a 216px room holding 2,323px of content.

   Nothing is hidden and nothing moves behind a menu. The item stops stacking:
   the label and its question sit on one line, in a fixed label column so the
   questions align down the dock, and seven single lines are ~140px. The held
   instrument is still seated by its leading rule and its surface rather than by
   extra padding, which keeps every row the same height and the dock's height
   predictable whichever instrument is held. */
@media (max-width:767px){
  .c-lenses{display:flex;flex-direction:column;padding:0}
  /* The ordinal keeps its place at a phone width but the state line does not:
     seven three-line rows would take 210px of an 780px screen, and the room is
     where the state is already stated. Index, name and question stay on one
     line; padding-left is the ordinal's column, not sp-8. */
  .c-lenses button{display:flex;align-items:baseline;gap:var(--sp-2);
    padding:3px var(--sp-4) 3px 26px}
  .c-lens-i{left:var(--sp-3);top:4px}
  .c-lens-s{display:none}
  .c-lens-n{flex:0 0 88px;line-height:1.35}
  .c-lens-q{flex:1 1 auto;padding-top:0;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-lenses button.on{padding-top:3px;padding-bottom:3px}
}


/* ------------------------------------------------------------- palette
   Case navigation, not application search. Sits above everything, dismisses
   on backdrop or Escape, and returns focus where it came from. */
.c-pal{position:fixed;inset:0;z-index:60;background:rgba(16,20,24,.28);
display:flex;align-items:flex-start;justify-content:center;
padding-top:12vh;backdrop-filter:blur(2px)}
.c-pal[hidden]{display:none}
.c-pal-box{width:min(620px,92vw);background:var(--sur);border:1px solid var(--line2);
border-radius:var(--r-lg);box-shadow:0 18px 48px rgba(16,20,24,.22);overflow:hidden;
animation:pal-in var(--standard)}
@keyframes pal-in{from{opacity:0;transform:translateY(-6px) scale(.99)}}
.c-pal-q{width:100%;border:0;outline:0;background:0;color:var(--ink);
font:var(--type-title)/1.4 var(--s);padding:var(--sp-4) var(--sp-5);
border-bottom:1px solid var(--line)}
.c-pal-q::placeholder{color:var(--dim3);font-size:var(--type-data)}
.c-pal-list{list-style:none;margin:0;padding:var(--sp-1) 0;
max-height:46vh;overflow-y:auto}
.c-pal-i{display:grid;grid-template-columns:82px minmax(0,auto) minmax(0,1fr);
gap:var(--sp-3);align-items:baseline;padding:var(--sp-2) var(--sp-5);cursor:pointer}
.c-pal-i.on{background:var(--sur3);box-shadow:inset 2px 0 0 var(--acc)}
.c-pal-g{font-size:var(--type-micro);letter-spacing:.12em;text-transform:uppercase;
color:var(--dim3)}
.c-pal-l{font-family:var(--m);font-size:var(--type-body);color:var(--ink)}
.c-pal-h{font-size:var(--type-label);color:var(--dim3);overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.c-pal-none{padding:var(--sp-4) var(--sp-5);color:var(--dim2);
font-size:var(--type-label);max-width:60ch}
.c-pal-foot{display:flex;gap:var(--sp-5);padding:var(--sp-2) var(--sp-5);
border-top:1px solid var(--line);font-size:var(--type-micro);color:var(--dim3)}
.c-pal-foot kbd{font-family:var(--m);border:1px solid var(--line2);
border-radius:var(--r-sm);padding:0 4px;margin-right:3px}
@media (max-width:767px){.c-pal{padding-top:6vh}}

/* ------------------------------------------------------------ workspace
 * #workspace no longer scrolls — .w-main does. A drawer positioned inside a
 * scrolling container scrolls away with the content it is meant to be
 * inspecting, which is the difference between a drawer and a section. */
#workspace{position:relative;overflow:hidden;min-height:0;display:grid;
grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
#workspace>*{min-width:0}

/* ------------------------------------------------------- the state spine
   Structural, not a lens's decoration. Rendered by the shell for every lens
   and both subjects, so "where is the money and where does it stop" is
   answerable at every moment rather than on two views out of fourteen. It
   spans the full width above master and context, so opening a context does
   not disturb it. */
#w-spine{grid-column:1/-1;padding:var(--sp-3) var(--sp-5) var(--sp-2);
border-bottom:1px solid var(--line)}
#w-spine:empty{display:none}
.c-flow.rail{gap:0}
.c-flow.rail .c-flow-r{padding:var(--sp-1) 0}
.c-flow.rail .c-flow-track{height:12px;max-width:none}
.c-flow.rail .c-flow-d{display:none}   /* the rail states, the lens explains */
#workspace.mode-master-detail.has-pane{grid-template-columns:minmax(340px,0.92fr)
minmax(0,1.08fr)}
#workspace.mode-master-detail.has-pane #w-spine{grid-column:1/-1}
/* No empty context pane. `has-pane` says this lens CAN hold a context;
   `has-ctx` says one is open. The pane was already hidden when nothing was
   selected, but its grid COLUMN stayed — so the master rendered at 54% of the
   workspace and the other 46% was reserved for a sentence. The absence of a
   context is itself the correct state, and it is what gives the opening
   transition something to mean. */
#workspace.mode-master-detail.has-pane:not(.has-ctx){grid-template-columns:minmax(0,1fr)}
.w-main{overflow-y:auto;padding:var(--s-5) var(--s-5) var(--s-7);min-width:0;
  /* Opening a context changes the master's height, and Chrome's scroll
     anchoring then nudges scrollTop to keep visible content still — which
     silently defeats the explicit restore in renderContext and loses the
     reader's place by a few dozen pixels. §7 says the master is where they
     already were, so the position is ours to decide, not the browser's. */
  overflow-anchor:none}
.mode-focus .w-main{max-width:1180px;width:100%}
/* The detail pane is the RAISED surface, because it is the thing you opened.
   It was on --sunk, which is undefined here and fell back to one hex value
   away from the page background — a divider line pretending to be a plane. */
.w-ctx{overflow-y:auto;min-width:0;border-left:1px solid var(--line);
background:var(--sur);padding:var(--s-5) var(--s-5) var(--s-7)}

/* In focus mode the pane is a drawer over the workspace rather than a column
   beside it: the subject stays visible underneath, which is what makes it read
   as opening something rather than going somewhere. */
.w-ctx.drawer{position:absolute;top:0;right:0;bottom:0;z-index:5;
width:min(480px,46vw);background:var(--sur);box-shadow:-10px 0 30px rgba(16,20,24,.10);
border-left:1px solid var(--line2)}
/* The drawer grows out of the row that opened it: --oy is the vertical centre
   of that row, set by the shell at click time. A pane that always expands from
   the same edge is a route transition with a different name. */
.w-ctx{transform-origin:right var(--oy,50%)}
@keyframes ctx-in{from{opacity:0;transform:translateX(10px) scaleY(.965)}}
@keyframes ctx-out{to{opacity:0;transform:translateX(8px) scaleY(.975)}}
.x-in-ctx{animation:ctx-in var(--med)}
.x-out-ctx{animation:ctx-out .11s cubic-bezier(.2,0,0,1) forwards}
@media (prefers-reduced-motion: reduce){
  .x-in-ctx,.x-out-ctx{animation:none}}

/* §6: the chain, stated. The UI must never suggest the context REPLACED the
   subject, and the only reliable way to say that is to show what it hangs off. */
.c-crumb{display:flex;align-items:center;gap:6px;font-size:var(--t-micro);
color:var(--dim3);margin-bottom:9px;flex-wrap:wrap}
.c-crumb i{font-style:normal;opacity:.6}
.c-crumb-s{font-family:var(--m)}
.c-crumb-l{letter-spacing:.1em;text-transform:uppercase}
.c-crumb-c{color:var(--ink);letter-spacing:.1em;text-transform:uppercase;
font-weight:600}
.c-ctx-h{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-5);
padding-bottom:var(--s-4);border-bottom:1px solid var(--line)}
.c-ctx-h b{font-size:var(--t-lead);font-weight:600}
.c-ctx-h .k{font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.c-ctx-x{margin-left:auto;display:flex;gap:var(--s-2)}
.c-ctx-b{background:transparent;border:1px solid var(--line);
border-radius:var(--r-2);padding:4px 10px;font-size:var(--t-label);
color:var(--dim2);cursor:pointer}
.c-ctx-b:hover{color:var(--ink);border-color:var(--line2)}
.c-ctx-b.go{border-color:var(--acc);color:var(--acc)}

/* a selected row stays selected while its detail is open */
.c-row.sel{background:var(--sur);border-left-color:var(--acc)}
.c-act.sel{border-color:var(--acc)}
#foot{height:24px;display:flex;align-items:center;gap:var(--s-4);
padding:0 var(--s-5);border-top:1px solid var(--line);background:var(--sur);
font-family:var(--m);font-size:var(--t-micro);color:var(--dim3)}

/* ------------------------------------------------------------ transitions
 * Two moves, two treatments, each preserving the axis that did not change.
 * TURN  lens changed — the header holds still, the workspace turns over.
 * SLIDE subject changed — the strip holds still, the workspace slides.
 * A refresh animates not at all, or the product flickers at itself. */
@keyframes turn-out{to{opacity:0;transform:translateY(-4px) scale(.996)}}
@keyframes turn-in{from{opacity:0;transform:translateY(6px) scale(.996)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-10px)}}
@keyframes slide-in{from{opacity:0;transform:translateX(14px)}}
.x-out-turn{animation:turn-out var(--fast) forwards}
.x-in-turn{animation:turn-in var(--med)}
.x-out-slide{animation:slide-out var(--fast) forwards}
.x-in-slide{animation:slide-in var(--med)}
@media (prefers-reduced-motion: reduce){
  .x-out-turn,.x-in-turn,.x-out-slide,.x-in-slide,

}

/* ------------------------------------------------------------- components */
.c-section{margin-bottom:var(--s-6)}
.p-front-r.hd{opacity:.55;font-family:var(--mono);font-size:var(--t-micro);
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);
  padding-bottom:5px;margin-bottom:4px}
.p-front-r.hd b{font-weight:400}

/* ── §58 the decision record — the primary object ────────────────────────
   Same object as the front door's, in the workspace's tokens. The advisory
   row is the only one drawn in outline: filled means this party can change
   financial state. */
.dr{border:1px solid var(--line2,var(--line));background:var(--sur);
  margin-bottom:var(--s-6)}
.dr-e{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 22px;
  align-items:baseline;padding:17px 19px;border-bottom:1px solid var(--line2,var(--line))}
.dr-e > *{min-width:0}
.dr-ek{font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim3);display:block;margin-bottom:7px}
.dr-ev{font-size:clamp(24px,2.6vw,34px);letter-spacing:-.03em;color:var(--ink);
  line-height:1;font-variant-numeric:tabular-nums}
.dr-eq{font-size:var(--t-label);color:var(--dim2);margin:8px 0 0;line-height:1.5}
.dr-em{font-family:var(--mono);font-size:var(--t-micro);color:var(--dim3);
  text-align:right;line-height:1.9;white-space:nowrap}
.dr-r{display:grid;grid-template-columns:112px 20px minmax(0,1fr);gap:0 14px;
  padding:14px 19px;border-bottom:1px solid var(--line);align-items:start}
.dr-r:last-child{border-bottom:0}
.dr-r > *{min-width:0}
.dr-a{display:flex;flex-direction:column;gap:3px}
.dr-a b{font-family:var(--mono);font-weight:400;font-size:var(--t-micro);
  letter-spacing:.14em;color:var(--ink)}
.dr-a em{font-style:normal;font-family:var(--mono);font-size:var(--t-micro);
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim3);opacity:.8}
.dr-r.adv .dr-a b{color:var(--st-INVESTIGATE)}
.dr-n{display:flex;justify-content:center;padding-top:4px}
.dr-dot{width:8px;height:8px;border-radius:50%;background:var(--dim3);flex:0 0 auto}
.dr-r.adv .dr-dot{background:transparent;
  box-shadow:inset 0 0 0 1.5px var(--st-INVESTIGATE)}
.dr-r.acts .dr-dot{background:var(--acc)}
.dr-r.holds .dr-dot{background:var(--st-AMBIGUOUS)}
.dr-b b.dr-h{display:block;font-family:var(--mono);font-weight:400;
  font-size:var(--t-body);color:var(--ink);margin-bottom:5px}
.dr-r.acts .dr-b b.dr-h{color:var(--acc)}
.dr-r.holds .dr-b b.dr-h{color:var(--st-AMBIGUOUS)}
.dr-badge{font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.13em;
  padding:1px 6px;border:1px solid currentColor;margin-left:9px;
  vertical-align:1px;white-space:nowrap}
.dr-r.adv .dr-badge{color:var(--st-INVESTIGATE)}
.dr-b p{font-size:var(--t-label);line-height:1.5;color:var(--dim2);margin:0}
.dr-b p + p{margin-top:5px}
.dr-b p b{color:var(--ink);font-weight:500}
.dr-may{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-top:10px}
.dr-may > *{min-width:0;background:var(--sur2);padding:7px 10px}
.dr-may i{font-style:normal;display:block;font-family:var(--mono);
  font-size:var(--t-micro);letter-spacing:.13em;text-transform:uppercase;
  margin-bottom:3px}
.dr-may .y i{color:var(--st-PROVEN)} .dr-may .n i{color:var(--st-CONTRADICTED)}
.dr-may span{font-size:var(--t-micro);line-height:1.5;color:var(--dim2)}
.dr-ids{display:block;margin-top:6px;font-family:var(--mono);
  font-size:var(--t-micro);color:var(--st-INVESTIGATE);word-break:break-all;
  line-height:1.7}
.dr-nar{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  font-family:var(--mono);font-size:var(--t-body);color:var(--ink);margin-top:8px;
  font-variant-numeric:tabular-nums}
.dr-nar u{text-decoration:none;color:var(--dim3)}
.dr-cut{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 11px;
  margin-top:7px;font-family:var(--mono);font-size:var(--t-micro);
  color:var(--dim2);align-items:baseline}
.dr-cut > *{min-width:0}
.dr-cut .rm{color:var(--ink);font-variant-numeric:tabular-nums}
.dr-cut .k{letter-spacing:.1em;text-transform:uppercase}
.dr-cut .k.c{color:var(--st-AMBIGUOUS)} .dr-cut .k.d{color:var(--st-PROVEN)}
.dr-je{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;
  margin-top:8px;font-family:var(--mono);font-size:var(--t-micro);color:var(--dim2)}
.dr-je > *{min-width:0}
.dr-je .amt{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.dr-out{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 22px;
  align-items:baseline;padding:15px 19px;border-top:1px solid var(--line2,var(--line));
  background:var(--sur2)}
.dr-out > *{min-width:0}
.dr-oh{font-size:var(--t-h3);letter-spacing:-.02em;line-height:1.15}
.dr-out.go .dr-oh{color:var(--acc)} .dr-out.stop .dr-oh{color:var(--st-AMBIGUOUS)}
.dr-oc{font-size:var(--t-label);color:var(--dim2);margin:5px 0 0;line-height:1.5}
.dr-ov{font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.13em;
  text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;
  white-space:nowrap}
.dr-out.go .dr-ov{color:var(--acc)} .dr-out.stop .dr-ov{color:var(--st-AMBIGUOUS)}
@media(max-width:760px){
  .dr-r{grid-template-columns:1fr;gap:8px}
  .dr-n{display:none}
  .dr-may,.dr-e,.dr-out{grid-template-columns:1fr}
  .dr-em{text-align:left}
}
.p-front-r.hd{opacity:.55;font-family:var(--mono);font-size:var(--t-micro);
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);
  padding-bottom:5px;margin-bottom:4px}
.p-front-r.hd b{font-weight:400}

.c-section-h{display:flex;align-items:baseline;gap:var(--s-3);
margin-bottom:var(--s-4)}
.c-section-h h3{font-size:var(--t-micro);letter-spacing:.14em;
text-transform:uppercase;color:var(--dim3);font-weight:600}
.c-section-h .a{margin-left:auto}
.c-muted{color:var(--dim3);font-size:var(--t-label)}
.c-lead{font-size:var(--t-lead);line-height:1.5;color:var(--dim)}

.c-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:var(--s-4) var(--s-5)}
.c-metric{display:flex;flex-direction:column;gap:3px}
.c-metric .k{font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.c-metric .v{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-h2);letter-spacing:-.02em;line-height:1.1}
.c-metric .n{font-size:var(--t-label);color:var(--dim3);line-height:1.45}

.c-status{font-size:var(--t-micro);letter-spacing:.1em;font-weight:600;
padding:2px 7px;border-radius:var(--r-full);white-space:nowrap;
color:var(--st-INSUFFICIENT);background:var(--st-INSUFFICIENT-bg)}
.c-status.sm{font-size:var(--type-micro);padding:1px 6px}
.s-PROVEN{color:var(--st-PROVEN);background:var(--st-PROVEN-bg)}
.s-AMBIGUOUS{color:var(--st-AMBIGUOUS);background:var(--st-AMBIGUOUS-bg)}
.s-CONTRADICTED{color:var(--st-CONTRADICTED);background:var(--st-CONTRADICTED-bg)}
.s-SYSTEMIC{color:var(--st-SYSTEMIC);background:var(--st-SYSTEMIC-bg)}
.s-INVESTIGATE{color:var(--st-INVESTIGATE);background:var(--st-INVESTIGATE-bg)}

/* A row is a line in a ledger, not a card. The old treatment gave nineteen
   bordered boxes on one screen, and when everything is a card nothing has
   hierarchy. Rows get a hairline; only genuinely interactive objects get a
   surface. */
.c-row{display:flex;align-items:center;gap:var(--s-4);width:100%;
padding:9px var(--s-3);border:0;border-bottom:1px solid var(--line);
border-left:2px solid transparent;background:transparent;
text-align:left;font:inherit;color:var(--ink)}
.c-row.link{cursor:pointer;transition:background var(--fast),
border-left-color var(--fast)}
.c-row.link:hover{background:var(--sur);border-left-color:var(--acc)}
.c-dot{width:6px;height:6px;border-radius:var(--r-full);flex:none;
background:currentColor}
.c-row-id{font-family:var(--m);font-size:var(--t-label);color:var(--dim3);
min-width:70px}
.c-row-amt{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);min-width:118px;text-align:right}
.c-row-d{flex:1;font-size:var(--t-label);color:var(--dim2)}
.c-row-a{font-size:var(--t-micro);color:var(--dim3);white-space:nowrap}

.c-group{margin-bottom:var(--s-4)}
.c-group-h{display:flex;align-items:baseline;gap:var(--s-3);padding:0 0 6px}
.c-group-h b{font-size:var(--t-body)}
.c-group-h span{font-family:var(--m);font-size:var(--t-label);color:var(--dim3)}
.c-group-h em{margin-left:auto;font-style:normal;font-family:var(--m);
font-variant-numeric:tabular-nums;font-size:var(--t-body)}
.c-more{font-size:var(--t-label);color:var(--dim3);padding:4px 0 0}
.c-group-d{font-size:var(--t-label);color:var(--dim3);line-height:1.55;
padding:0 0 8px;max-width:92ch}

/* the decision block — an instrument reading, not a paragraph */
.c-decide{display:flex;flex-direction:column;gap:var(--s-4)}
.c-decide-v{display:flex;align-items:center;gap:10px;font-size:var(--t-h3);
font-weight:600;letter-spacing:-.02em}
.c-decide-v i{width:9px;height:9px;border-radius:var(--r-full);flex:none;
background:var(--st-CONTRADICTED)}
.c-decide-v.yes i{background:var(--st-PROVEN)}
.c-decide-f{display:grid;grid-template-columns:150px 1fr;gap:7px var(--s-4);
align-items:baseline}
.c-decide-f>div{display:contents}
.c-decide-f dt{font-size:var(--t-micro);letter-spacing:.12em;
text-transform:uppercase;color:var(--dim3);font-weight:600}
.c-decide-f dd{font-size:var(--t-label);color:var(--dim2);line-height:1.6;
max-width:88ch}
@media (max-width:620px){.c-decide-f{grid-template-columns:1fr;gap:2px}
  .c-decide-f>div{display:block;margin-bottom:9px}}

.c-table{width:100%;border-collapse:collapse;font-size:var(--t-label)}
.c-table th{text-align:left;font-size:var(--t-micro);letter-spacing:.1em;
text-transform:uppercase;color:var(--dim3);font-weight:600;
padding:0 var(--s-3) 6px 0;border-bottom:1px solid var(--line)}
.c-table td{padding:7px var(--s-3) 7px 0;border-bottom:1px solid var(--line)}
.c-table .num{text-align:right;font-family:var(--m);
font-variant-numeric:tabular-nums;white-space:nowrap}
.c-table .foot td{border-bottom:0;border-top:2px solid var(--line2);
font-weight:600;padding-top:8px}

.c-disc{margin-top:var(--s-3);border-top:1px solid var(--line);padding-top:8px}
.c-disc summary{font-size:var(--t-label);color:var(--dim3);cursor:pointer;
list-style:none;display:flex;align-items:center;gap:6px}
.c-disc summary::-webkit-details-marker{display:none}
.c-disc summary::before{content:"›";display:inline-block;color:var(--dim3);
transition:transform var(--fast)}
.c-disc[open] summary::before{transform:rotate(90deg)}
.c-disc summary:hover{color:var(--acc)}
.c-disc-b{padding:9px 0 2px 14px;color:var(--dim2);font-size:var(--t-label);
line-height:1.65;max-width:84ch}
.c-disc-b p+p{margin-top:7px}
.c-disc-b code{font-family:var(--m);font-size:var(--t-small)}
.c-reasons{margin-left:var(--sp-4)}
.c-reasons li{margin-bottom:4px}

.c-empty{padding:var(--s-6) 0;color:var(--dim3);font-size:var(--t-label);
display:flex;flex-direction:column;gap:5px}
.c-empty.err{color:var(--st-CONTRADICTED)}
.c-spin{width:11px;height:11px;border:1.5px solid var(--line2);
border-top-color:var(--acc);border-radius:var(--r-full);
display:inline-block;animation:sp .7s linear infinite;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.c-notice{background:var(--st-AMBIGUOUS-bg);color:var(--st-AMBIGUOUS);
border-radius:var(--r-2);padding:8px var(--s-4);font-size:var(--t-label);
margin-bottom:var(--s-4)}

/* ----------------------------------------------------------------- flow
 * The money narrowing IS the story. A bar collapsing from full width to a
 * sliver at Verification should be readable before any number is, which five
 * equal cards with ticks could never do — that was a stepper wearing a
 * financial diagram's clothes. */
.c-flow{display:flex;flex-direction:column;gap:1px}
.c-flow-r{display:grid;grid-template-columns:96px minmax(160px,1fr) 132px auto;
gap:var(--s-4);align-items:center;padding:7px 0}
.c-flow-n{font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.c-flow-track{height:18px;max-width:520px;background:var(--sur3);
border-radius:var(--r-0);overflow:hidden;position:relative}
.c-flow-bar{display:block;height:100%;background:var(--st-PROVEN);
border-radius:var(--r-0);transition:width var(--med)}
.c-flow-r.stopped .c-flow-bar{background:var(--st-AMBIGUOUS)}
.c-flow-r.not_reached .c-flow-track{background:repeating-linear-gradient(
  -45deg,var(--sur3),var(--sur3) 3px,transparent 3px,transparent 6px)}
.c-flow-v{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);text-align:right}
.c-flow-x{font-size:var(--t-label);color:var(--dim3)}
.c-flow-r.stopped .c-flow-x{color:var(--st-CONTRADICTED)}
.c-flow-x b{font-family:var(--m);font-weight:400}
.c-flow-r.not_reached{opacity:.45}
.c-flow-d{grid-column:2/5;font-size:var(--t-label);color:var(--dim2);
padding:0 0 9px 108px;line-height:1.5;max-width:96ch}

/* ---------------------------------------------------------------- evidence
 * The candidate universe, proportionally: the drop from the book to the pool
 * must be visible as a drop, and the reductions that are conventions rather
 * than facts must say so. That distinction is what the 32/92 failure was about.
 */
/* rebuilt as evidence objects · §30.3, at the foot of this stylesheet */
.e-red{margin-top:var(--s-4);display:flex;flex-direction:column;gap:2px}

/* agreement as a block, disagreement as the sliver beside it */
.e-set{display:flex;flex-direction:column;gap:2px}
.e-set-hd{display:grid;grid-template-columns:22px minmax(160px,420px) 1fr;
gap:var(--s-4);font-size:var(--t-micro);letter-spacing:.12em;
text-transform:uppercase;color:var(--dim3);font-weight:600;padding-bottom:5px}
.e-set-hd .e-set-a{grid-column:2}
.e-set-r{display:grid;grid-template-columns:22px minmax(160px,420px) 108px 1fr;
gap:var(--s-4);align-items:center;width:100%;border:0;
border-left:2px solid transparent;background:transparent;padding:5px var(--s-3);
font:inherit;color:inherit;cursor:pointer;text-align:left;
transition:background var(--fast),border-left-color var(--fast)}
.e-set-r:hover{background:var(--sur)}
.e-set-r.sel{background:var(--sur);border-left-color:var(--acc)}
.e-set-l{font-family:var(--m);color:var(--dim3)}
.e-set-bar{display:flex;height:16px;background:var(--sur3);
border-radius:var(--r-0);overflow:hidden}
.e-set-bar i{display:block;height:100%}
.e-set-bar .s{background:var(--dim3);opacity:.38}
.e-set-bar .u{background:var(--st-AMBIGUOUS)}
.e-set-n{font-family:var(--m);font-size:var(--t-label);color:var(--dim2);
text-align:right}
.e-set-n b{color:var(--st-AMBIGUOUS)}
.e-set-v{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-label)}
.e-set-ft{display:flex;flex-direction:column;gap:3px;
padding:10px 0 0 calc(22px + var(--s-4));font-size:var(--t-label);
color:var(--dim3)}
.e-set-ft b{color:var(--ink);font-family:var(--m)}
.e-set-ft b.warn{color:var(--st-AMBIGUOUS)}

.e-rel{border-bottom:1px solid var(--line);padding:9px var(--s-3)}
.e-rel-h{display:flex;align-items:baseline;gap:var(--s-3)}
.e-rel-h b{font-size:var(--t-body)}
.e-rel-n{font-family:var(--m);font-size:var(--t-label);color:var(--dim3)}
.e-rel-v{margin-left:auto;font-size:var(--t-micro);color:var(--st-PROVEN);
letter-spacing:.08em;text-transform:uppercase}
.e-rel-w{font-size:var(--t-label);color:var(--dim3);margin-top:3px;max-width:92ch}
.e-ok{color:var(--st-PROVEN);font-size:var(--t-micro)}

/* the model's proposals get a different visual language on purpose: a dashed
   rail and a diamond, so a hypothesis can never be mistaken for a fact */
.e-ai-tag{font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;
color:var(--st-INVESTIGATE);border:1px dashed var(--st-INVESTIGATE);

align-items:baseline;font-size:var(--t-label)}
.e-ai-w{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;
color:var(--dim3)}
.e-ai-r.proposed .e-ai-w{color:var(--st-INVESTIGATE)}
.e-ai-d{color:var(--dim2);line-height:1.55}
.e-ai-v{font-size:var(--t-label);color:var(--dim2);padding-top:7px;
border-top:1px solid var(--line);margin-top:4px}
.e-ai-v b{color:var(--st-CONTRADICTED)}
.e-ai-none{font-size:var(--t-label);color:var(--dim3)}








.e-prov{display:grid;grid-template-columns:100px 1fr;gap:6px var(--s-4)}

color:var(--dim3);font-weight:600}

@media (max-width:900px){
  .e-uni-r,.e-uni-c{grid-template-columns:1fr;gap:2px}
  .e-uni-n,.e-uni-m{text-align:left}
  .e-set-r,.e-set-hd{grid-template-columns:20px 1fr auto}
  .e-set-v{display:none}
}

/* ------------------------------------------------------------- investigate
 * Temporal and forensic, where Evidence is structural and calm. A rail with
 * three actors on it, and the order is the argument: the model proposes, the
 * solver tests, the engine decides. */
.i-q{margin-bottom:var(--s-6)}
.i-q-k{display:block;font-size:var(--t-micro);letter-spacing:.14em;
text-transform:uppercase;color:var(--dim3);font-weight:600;margin-bottom:5px}
.i-q h2{font-size:var(--t-h3);font-weight:600;letter-spacing:-.02em;
line-height:1.3;max-width:44ch}

.i-tl{list-style:none;position:relative;padding-left:var(--s-5)}
.i-tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;
background:var(--line2)}
/* A TEST LOG, not a timeline.
   Investigate and Activity were the product's closest pair (0.721): both
   rendered as a flat vertical list of actor-marked steps, and connectors
   alone did not separate them because the shared shape is the row itself.
   So the shapes differ now. Activity is a chain — events linked by their
   causes, read downward. This is a ledger of attempts: each row is a claim
   on the left and what happened to it on the right, in columns, because
   the question Investigate answers is "what was tried and did it work". */
.i-tl-s{position:relative;display:grid;
grid-template-columns:minmax(0,1fr) minmax(0,168px);
column-gap:var(--sp-5);align-items:start;
padding:var(--sp-2) var(--sp-2) var(--sp-4) var(--sp-4);cursor:pointer;
border-top:1px solid var(--line);border-radius:0;
transition:background var(--fast)}
.i-tl-s:first-child{border-top:0}
.i-tl-s .i-tl-r{grid-column:2;grid-row:1;margin-left:0;text-align:right;
align-self:start;padding-top:2px}
.i-tl-s:hover{background:var(--sur)}
.i-tl-s.sel{background:var(--sur)}
.i-tl-m{position:absolute;left:-19px;top:4px;width:9px;height:9px;
border-radius:var(--r-full);background:var(--bg);border:2px solid var(--line2)}
.e-act-model .i-tl-m{border-color:var(--st-INVESTIGATE);
transform:rotate(45deg);border-radius:2px}
.e-act-solver .i-tl-m{border-color:var(--st-AMBIGUOUS)}
.e-act-engine .i-tl-m{border-color:var(--ink);background:var(--ink)}
.i-tl-h{display:flex;align-items:baseline;gap:var(--s-3);flex-wrap:wrap;
margin-bottom:4px}
.i-tl-a{font-size:var(--t-micro);letter-spacing:.12em;text-transform:uppercase;
font-weight:600}
.e-act-model .i-tl-a{color:var(--st-INVESTIGATE)}
.e-act-solver .i-tl-a{color:var(--st-AMBIGUOUS)}
.e-act-engine .i-tl-a{color:var(--ink)}
.i-tl-v{font-size:var(--t-label);color:var(--dim3)}
.i-tl-i{font-family:var(--m);font-size:var(--t-micro);color:var(--dim2);
background:var(--sur3);border-radius:var(--r-1);padding:1px 6px}
.i-tl-r{margin-left:auto;font-family:var(--m);font-size:var(--t-micro);
letter-spacing:.06em;color:var(--st-CONTRADICTED)}
.i-tl-r.r-VALID{color:var(--st-PROVEN)}
.i-tl-r.r-ABSTAINED{color:var(--dim2)}
.i-tl-d{font-size:var(--t-label);color:var(--dim2);line-height:1.55;max-width:88ch}
.i-tl-w{font-size:var(--t-label);color:var(--dim3);line-height:1.5;margin-top:3px;
max-width:88ch}

/* the signal the pool itself gives about the lens the model chose */
.i-sig-r{display:flex;align-items:baseline;gap:var(--s-4);margin-bottom:7px}
.i-sig-n{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-num);line-height:1;letter-spacing:-.03em}
.i-sig-l{font-size:var(--t-label);color:var(--dim3)}
.i-sig-d{font-size:var(--t-label);color:var(--dim2);line-height:1.6;max-width:88ch}

/* §25 — restraint, not error */
/* .i-abs-v held a second 'Engine abstained' beneath the one that leads the
   room. A rule with no element is a guess about the future, so it goes too. */
/* ------------------------------------------------------- THE AI BOUNDARY
   Three actors, three marks, one row of facts. The hero is the boundary; the
   benchmark note is supporting evidence at the smallest readable size, and it
   is the only sentence here that is about a panel rather than this case. The
   marks reuse the shapes the timeline already owns, so grayscale carries it. */
.i-bound{border-left:2px solid var(--ink);padding:var(--sp-4) var(--sp-5);
  margin:var(--sp-6) 0;max-width:82ch}
.i-bound-k{font-size:var(--type-micro);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim3);padding-bottom:var(--sp-3)}
.i-bound-s{display:grid;grid-template-columns:14px 84px minmax(0,1fr);
  gap:var(--sp-3);align-items:baseline;padding:3px 0}
.i-bound-s b{font-family:var(--m);font-size:var(--type-micro);
  letter-spacing:.13em;color:var(--ink);font-weight:400}
.i-bound-s span{font-size:var(--type-body);color:var(--dim)}
.i-bound-dot{display:block;width:9px;height:9px;justify-self:center;
  align-self:center;border:1.5px solid var(--dim2)}
.i-bound-dot.model{transform:rotate(45deg)}
.i-bound-dot.solver{border-radius:999px}
.i-bound-dot.engine{border-radius:999px;background:var(--ink);
  border-color:var(--ink)}
.i-bound-r{display:flex;flex-wrap:wrap;gap:var(--sp-6);
  padding:var(--sp-4) 0 var(--sp-3);margin-top:var(--sp-3);
  border-top:1px solid var(--line)}
.i-bound-r span{display:flex;flex-direction:column;gap:2px}
.i-bound-r i{font-style:normal;font-size:var(--type-micro);letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim3)}
.i-bound-r b{font-size:var(--type-data);font-weight:500}
.i-bound-x{font-size:var(--type-label);color:var(--dim);line-height:1.6}
.i-bound-m-note{font-size:var(--type-micro);color:var(--dim3);line-height:1.6;
  padding-top:var(--sp-3);margin-top:var(--sp-3);
  border-top:1px solid var(--line)}
.i-bound-m-note b{font-family:var(--m);color:var(--dim2);font-weight:400}

.i-res{display:flex;flex-direction:column;gap:1px}
.i-res-r{display:grid;grid-template-columns:106px 1fr 1fr;gap:var(--s-4);
align-items:baseline;padding:9px var(--s-3);border-bottom:1px solid var(--line)}
.i-res-s{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;
color:var(--st-AMBIGUOUS)}
.i-res-s.s-available-now{color:var(--st-PROVEN)}
.i-res-w{font-size:var(--t-label)}
.i-res-d{font-size:var(--t-label);color:var(--dim3)}

.i-case{display:block;width:100%;text-align:left;background:transparent;
border:0;border-bottom:1px solid var(--line);border-left:2px solid transparent;
padding:11px var(--s-3);cursor:pointer;font:inherit;color:inherit;
transition:background var(--fast),border-left-color var(--fast)}
.i-case:hover{background:var(--sur)}
.i-case.sel{background:var(--sur);border-left-color:var(--acc)}
.i-case.one{border-left-color:var(--st-PROVEN)}
.i-case.one.sel{border-left-color:var(--acc)}
.i-case-q{display:block;font-size:var(--t-body);line-height:1.4;
margin-bottom:6px;max-width:52ch}
.i-case-m{display:flex;align-items:baseline;gap:var(--s-4);
font-size:var(--t-label);color:var(--dim3)}
.i-case-m em{font-style:normal;font-family:var(--m);
font-variant-numeric:tabular-nums;font-size:var(--t-body);color:var(--ink)}
.i-case-k{margin-left:auto;font-size:var(--t-micro);letter-spacing:.08em;
text-transform:uppercase}
.i-case.one .i-case-k{color:var(--st-PROVEN)}

@media (max-width:900px){
  .i-res-r{grid-template-columns:1fr;gap:2px}
  .i-tl-r{margin-left:0}
}

/* ------------------------------------------------------------------ policy
 * A decision boundary, not a rule list. Evidence is relational, Investigate is
 * temporal, this is a line with two numbers either side of it. */
.p-head{margin-bottom:var(--s-6)}
.p-head-k{display:block;font-size:var(--t-micro);letter-spacing:.14em;
text-transform:uppercase;color:var(--dim3);font-weight:600;margin-bottom:5px}
.p-head-d{display:flex;align-items:center;gap:11px;font-size:var(--t-h2);
font-weight:600;letter-spacing:-.02em;line-height:1.15}
.p-head-d i{width:10px;height:10px;border-radius:var(--r-full);flex:none;
background:var(--dim3)}
.p-head.AUTO_POST .p-head-d i{background:var(--st-PROVEN)}
.p-head.REVIEW .p-head-d i{background:var(--st-AMBIGUOUS)}
.p-head.BLOCK .p-head-d i{background:var(--st-CONTRADICTED)}
.p-head-s{font-size:var(--t-label);color:var(--dim3);margin-top:7px}
.p-sim{display:inline-block;font-size:var(--t-micro);letter-spacing:.1em;
text-transform:uppercase;color:var(--st-INVESTIGATE);
border:1px dashed var(--st-INVESTIGATE);border-radius:var(--r-full);
padding:3px 11px;margin-bottom:11px}
.p-sim-tag{font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;
color:var(--st-INVESTIGATE);border:1px dashed var(--st-INVESTIGATE);
border-radius:var(--r-full);padding:2px 9px}

/* the boundary itself */
/* rebuilt as evidence objects · §30.5, at the foot of this stylesheet */

/* the safety chain — proof, then policy, in that order */
.p-gates{display:flex;flex-direction:column;gap:var(--s-3)}
.p-stage-h{font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
color:var(--dim3);font-weight:600;margin-bottom:5px}
.p-stage-arrow{align-self:flex-start;margin-left:9px;width:1px;height:12px;
background:var(--line2)}
.p-gate{display:grid;grid-template-columns:18px 1fr 116px;
grid-template-areas:"i n s" ". w w";gap:2px var(--s-3);align-items:baseline;
padding:7px var(--s-3);border-bottom:1px solid var(--line)}
.p-gate i{grid-area:i;font-style:normal;font-size:var(--t-label)}
.p-gate.ok i{color:var(--st-PROVEN)}
.p-gate.no i{color:var(--dim3)}
.p-gate-n{grid-area:n;font-size:var(--t-label)}
.p-gate-s{grid-area:s;font-size:var(--t-micro);letter-spacing:.08em;
text-transform:uppercase;text-align:right;color:var(--dim3)}
.p-gate.ok .p-gate-s{color:var(--st-PROVEN)}
.p-gate-w{grid-area:w;font-size:var(--t-label);color:var(--dim3);line-height:1.5;
max-width:86ch}

.p-in{display:grid;grid-template-columns:150px 1fr;gap:7px var(--s-4)}
.p-in>div{display:contents}
.p-in dt{font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;
color:var(--dim3);font-weight:600}
.p-in dd b{font-family:var(--m);font-size:var(--t-body);font-weight:400}
.p-in dd span{display:block;font-size:var(--t-label);color:var(--dim3);
line-height:1.5;margin-top:2px;max-width:84ch}

.p-grp{display:grid;grid-template-columns:110px minmax(80px,1fr) 130px 130px;
gap:var(--s-4);align-items:center;width:100%;border:0;
border-bottom:1px solid var(--line);border-left:2px solid transparent;
background:transparent;padding:10px var(--s-3);font:inherit;color:inherit;
cursor:pointer;text-align:left;
transition:background var(--fast),border-left-color var(--fast)}
.p-grp:hover{background:var(--sur)}
.p-grp.sel{background:var(--sur);border-left-color:var(--acc)}
.p-grp-d{font-size:var(--t-micro);letter-spacing:.1em;font-weight:600}
.p-grp.d-AUTO_POST .p-grp-d{color:var(--st-PROVEN)}
.p-grp.d-REVIEW .p-grp-d{color:var(--st-AMBIGUOUS)}
.p-grp.d-BLOCK .p-grp-d{color:var(--st-CONTRADICTED)}
.p-grp-b{height:14px;background:var(--sur3);border-radius:var(--r-0);
overflow:hidden}
.p-grp-b i{display:block;height:100%;background:var(--dim3);opacity:.5}
.p-grp.d-AUTO_POST .p-grp-b i{background:var(--st-PROVEN);opacity:1}
.p-grp-n{font-size:var(--t-label);color:var(--dim3);text-align:right}
.p-grp-v{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);text-align:right}

.p-sim-c{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-4);
flex-wrap:wrap}
.p-sim-c label{font-size:var(--t-label);color:var(--dim3)}
.p-sim-c input{flex:1;min-width:160px;max-width:320px;accent-color:var(--acc)}
.p-sim-c output{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);min-width:96px}
.p-front{display:flex;flex-direction:column;gap:1px}
.p-front-r{display:grid;grid-template-columns:98px minmax(70px,1fr) 46px 116px 88px;
gap:var(--s-4);align-items:center;padding:5px var(--s-3);
font-size:var(--t-label);border-left:2px solid transparent}
.p-front-r.on{background:var(--sur);border-left-color:var(--acc)}
.p-front-c{font-family:var(--m);color:var(--dim3);text-align:right}
.p-front-r.on .p-front-c{color:var(--ink)}
.p-front-b{height:10px;background:var(--sur3);border-radius:var(--r-0);
overflow:hidden}
.p-front-b i{display:block;height:100%;background:var(--st-PROVEN)}
.p-front-n{font-family:var(--m);text-align:right;color:var(--dim2)}
.p-front-v{font-family:var(--m);font-variant-numeric:tabular-nums;text-align:right}
.p-front-w{font-size:var(--t-micro);color:var(--dim3);text-align:right}
.p-front-w b{color:var(--st-CONTRADICTED)}

@media (max-width:900px){
  .p-gate{grid-template-columns:18px 1fr;grid-template-areas:"i n" ". s" ". w"}
  .p-gate-s{text-align:left}
  .p-in{grid-template-columns:1fr;gap:2px}
  .p-in>div{display:block;margin-bottom:9px}
  .p-grp{grid-template-columns:96px 1fr;gap:3px var(--s-3)}
  .p-grp-b{display:none}
  .p-front-r{grid-template-columns:88px 1fr 96px}
  .p-front-b,.p-front-w{display:none}
}

/* ---------------------------------------------------------------- activity
 * Causality is the connector, not a column. The cause sits ON the line between
 * two events, so the reader traverses it rather than looking it up. */
.a-state{margin-bottom:var(--s-6)}
.a-state-k{display:block;font-size:var(--t-micro);letter-spacing:.14em;
text-transform:uppercase;color:var(--dim3);font-weight:600;margin-bottom:6px}
.a-state-r{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
font-size:var(--t-lead)}
.a-state-r i{font-style:normal;color:var(--dim3)}
.a-state-p{font-family:var(--m);font-size:var(--t-body)}
.a-state-a{font-size:var(--t-label);letter-spacing:.08em;text-transform:uppercase}
.a-state-a.yes{color:var(--st-PROVEN)}
.a-state-a.no{color:var(--dim3)}

.a-tl{position:relative;padding-left:var(--s-5)}
/* Causality as structure, not as a line of prose between two rows.
   Activity's primitive is CAUSE │ EVENT │ EFFECT, and Investigate's is a
   reasoning trail — they were measurably the closest pair in the product
   (0.721) because both rendered as a flat vertical list of actor-marked
   steps. The connector makes Activity's chain a chain: the "because" hangs
   off a rule that physically links the event above to the one below. */
.a-cause{display:grid;grid-template-columns:auto minmax(0,1fr);
align-items:center;gap:var(--sp-3);
padding:var(--sp-1) 0 var(--sp-1) var(--sp-5);position:relative;
font-style:italic}
.a-cause::before{content:"";position:absolute;left:var(--sp-4);top:0;bottom:0;
width:1px;background:var(--line2)}
.a-cause::after{content:"";position:absolute;left:calc(var(--sp-4) - 2px);
bottom:0;width:5px;height:5px;border-right:1px solid var(--line2);
border-bottom:1px solid var(--line2);transform:rotate(45deg) translate(-1px,-1px)}
.a-cause i{width:1px;height:20px;background:var(--line2);flex:none;
margin-left:-19px}
.a-cause span{font-size:var(--t-micro);color:var(--dim3);font-style:italic}
.a-ev{display:flex;gap:var(--s-4);padding:8px var(--s-3) 8px var(--s-4);
border-radius:var(--r-2);cursor:pointer;position:relative;
transition:background var(--fast)}
.a-ev:hover,.a-ev.sel{background:var(--sur)}
.a-mark{position:absolute;left:-19px;top:11px;width:16px;text-align:center;
font-style:normal;font-size:var(--t-label);line-height:1;background:var(--bg)}
.a-model .a-mark{color:var(--st-INVESTIGATE)}
.a-solver .a-mark{color:var(--st-AMBIGUOUS)}
.a-engine .a-mark{color:var(--ink)}
.a-policy .a-mark{color:var(--st-INVESTIGATE)}
.a-system .a-mark{color:var(--dim3)}
.a-none .a-mark{color:var(--dim3)}
.a-body{flex:1;min-width:0}
.a-h{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:3px}
.a-actor{font-size:var(--t-micro);letter-spacing:.12em;text-transform:uppercase;
font-weight:600}
.a-model .a-actor{color:var(--st-INVESTIGATE)}
.a-solver .a-actor{color:var(--st-AMBIGUOUS)}
.a-engine .a-actor,.a-policy .a-actor{color:var(--ink)}
.a-system .a-actor,.a-none .a-actor{color:var(--dim3)}
.a-stage{font-size:var(--t-micro);letter-spacing:.06em;color:var(--dim3)}
.a-at{margin-left:auto;font-family:var(--m);font-size:var(--t-micro);
color:var(--dim3)}
.a-what{font-size:var(--t-body);line-height:1.4;display:flex;
align-items:baseline;gap:var(--s-3);flex-wrap:wrap}
.a-res{font-family:var(--m);font-size:var(--t-micro);letter-spacing:.06em;
color:var(--dim2)}
.a-res.r-NON_DISCRIMINATIVE,.a-res.r-LEDGER_UNCHANGED{color:var(--st-CONTRADICTED)}
.a-res.r-LEDGER_UPDATED{color:var(--st-PROVEN)}
.a-badge{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;
border-radius:var(--r-full);padding:1px 8px;border:1px solid}
.a-badge.yes{color:var(--st-INVESTIGATE);border-color:var(--st-INVESTIGATE)}
.a-badge.no{color:var(--dim3);border-color:var(--line2)}
.a-badge.done{color:var(--st-PROVEN);border-color:var(--st-PROVEN)}
.a-badge.undone{color:var(--dim3);border-color:var(--line2);border-style:dashed}
.a-val{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);margin-top:3px}
.a-eff{font-size:var(--t-label);color:var(--dim3);line-height:1.5;
margin-top:var(--sp-1);max-width:88ch;padding-left:var(--sp-3);
border-left:2px solid var(--line)}

.a-out{display:flex;flex-direction:column;gap:1px}
.a-out-r{display:grid;grid-template-columns:1fr 140px 130px;gap:var(--s-4);
align-items:baseline;padding:8px var(--s-3);border-bottom:1px solid var(--line)}
.a-out-k{font-size:var(--t-label)}
.a-out-v{font-family:var(--m);font-variant-numeric:tabular-nums;
font-size:var(--t-body);text-align:right}
.a-out-n{font-size:var(--t-label);color:var(--dim3);text-align:right}

.a-del{display:flex;flex-direction:column;gap:1px}
.a-del-r{display:grid;grid-template-columns:74px 150px 1fr 130px;gap:var(--s-4);
align-items:baseline;padding:7px var(--s-3);border-bottom:1px solid var(--line);
font-size:var(--t-label)}
.a-del-t,.a-del-k{font-family:var(--m);font-size:var(--t-micro);color:var(--dim3)}
.a-del-d{color:var(--dim2)}
.a-del-s{font-size:var(--t-micro);letter-spacing:.06em;text-transform:uppercase;
text-align:right;color:var(--dim3)}
.a-del-s.s-accepted{color:var(--st-PROVEN)}
.a-del-s.s-duplicate{color:var(--dim3)}
.a-del-s.s-bad_signature,.a-del-s.s-replay_mismatch{color:var(--st-CONTRADICTED)}

.a-replay{display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap}
.a-replay .c-muted{flex:1;min-width:220px;line-height:1.55}
.a-rep{margin-top:var(--s-4);padding:var(--s-4);border-left:2px solid var(--line2);
background:var(--sur)}
.a-rep.ok{border-left-color:var(--st-PROVEN)}
.a-rep.no{border-left-color:var(--st-CONTRADICTED)}
.a-rep-v{font-size:var(--t-lead);font-weight:600;margin-bottom:9px}
.a-rep-n{font-size:var(--t-label);color:var(--dim2);line-height:1.6;
margin-top:9px;max-width:88ch}

@media (max-width:900px){
